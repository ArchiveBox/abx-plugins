name: Documentation tests

on:
  schedule:
    - cron: '19 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_SOURCES: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  documentation:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main'
    name: Documentation code blocks
    runs-on: ubuntu-24.04
    environment: provider-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install browser display and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Install locked dependencies
        run: |
          uv sync --locked --dev --no-sources --no-cache

      - name: Install the documentation downloader CLI
        run: |
          uv tool install --python 3.13 abx-dl==1.13.152
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "ABX_PLUGINS_DIR=$GITHUB_WORKSPACE/abx_plugins/plugins" >> "$GITHUB_ENV"

      - name: Install the matching Chrome sandbox helper
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/docs-abx-lib
        run: |
          chrome_sandbox="$(uv run --no-cache --no-sync --no-sources python .github/ci_chrome_sandbox.py)"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # Use SwiftShader only for WebGL; routing 2D PDF export through the
          # emulated GPU stalls Figma on CPU-limited runners.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"
      - name: Prepare authorized provider persona
        env:
          PROVIDER_AUTH_STORAGE_JSON: ${{ secrets.PROVIDER_AUTH_STORAGE_JSON }}
          FIGMA_AUTH_STORAGE_JSON: ${{ secrets.FIGMA_AUTH_STORAGE_JSON }}
        run: |
          set -Eeuo pipefail
          : "${PROVIDER_AUTH_STORAGE_JSON:?Missing provider-capture authentication secret}"
          umask 077
          auth_file="$(mktemp --suffix=.json "$RUNNER_TEMP/docs-auth.XXXXXX")"
          printf '%s' "$PROVIDER_AUTH_STORAGE_JSON" > "$auth_file"
          chmod 600 "$auth_file"
          # The filtered Figma refresh must not replace other providers' sessions.
          uv run --no-project python - "$auth_file" <<'PYAUTH'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          refresh = os.environ.get("FIGMA_AUTH_STORAGE_JSON")
          if refresh:
              path = Path(sys.argv[1])
              original = json.loads(path.read_text())
              figma = json.loads(refresh)

              # Both browser storage exports and extension exports are accepted
              # by Chrome. Normalize extension cookies before combining formats.
              for auth in (original, figma):
                  assert isinstance(auth.get("cookies", []), list), "Expected a cookies array"
                  if auth.get("SOURCE") != "archivebox-browser-extension":
                      continue
                  converted = []
                  for cookie in auth.get("cookies", []):
                      assert not cookie.get("partitionKey"), "Partitioned extension cookies are unsupported"
                      item = {key: cookie[key] for key in ("name", "value", "domain", "path", "secure", "httpOnly") if key in cookie}
                      if cookie.get("expirationDate") is not None:
                          item["expires"] = cookie["expirationDate"]
                      same_site = str(cookie.get("sameSite") or "").lower()
                      if same_site and same_site != "unspecified":
                          item["sameSite"] = {"no_restriction": "None", "none": "None", "lax": "Lax", "strict": "Strict"}[same_site]
                      converted.append(item)
                  if "cookies" in auth:
                      auth["cookies"] = converted
                  auth.pop("SOURCE")

              def is_figma(item, key):
                  value = item.get(key) or item.get("url") or ""
                  host = urlsplit(value if "://" in value else "//" + value.lstrip(".")).hostname or ""
                  return host == "figma.com" or host.endswith(".figma.com")

              for field, key in (("cookies", "domain"), ("origins", "origin"), ("tabs", "url")):
                  if field not in figma:
                      continue
                  incoming = [item for item in figma.get(field, []) if is_figma(item, key)]
                  original[field] = [item for item in original.get(field, []) if not is_figma(item, key)] + incoming
              path.write_text(json.dumps(original))
          PYAUTH
          {
            echo "AUTH_STORAGE_FILE=$auth_file"
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/docs-abx-lib"
            echo "PERSONAS_DIR=$RUNNER_TEMP/docs-personas"
          } >> "$GITHUB_ENV"
      - name: Run documentation code blocks
        env:
          CHROME_HEADLESS: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}/docs-pytest
          # Later nested pytest runs must not remove earlier failure evidence.
          PYTEST_ADDOPTS: "-o tmp_path_retention_count=100"
          ABX_CI_TEST_RESULTS_DIR: ${{ runner.temp }}/docs-test-results
        run: |
          mkdir -p "$PYTEST_DEBUG_TEMPROOT"
          mapfile -t plugin_readmes < <(uv run --no-cache --no-project python - <<'PY'
          from pathlib import Path

          for readme in sorted(Path("abx_plugins/plugins").glob("*/README.md")):
              print(readme)
          PY
          )
          test -f "$AUTH_STORAGE_FILE"
          xvfb-run -a uv run --no-cache --no-sync --no-sources pytest -vv --tb=long \
            README.md AGENTS.md skills docs "${plugin_readmes[@]}"

      - name: Save documentation test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-test-results
          path: ${{ runner.temp }}/docs-test-results/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Summarize failed browser navigation
        if: failure()
        run: |
          uv run --no-project python - <<'PYNAV'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(os.environ["RUNNER_TEMP"]) / "docs-pytest"
          records = []
          for path in sorted(root.glob("**/snap/test-snapshot/chrome/navigation.json")):
              state = json.loads(path.read_text())
              record = {"file": str(path.relative_to(root))}
              for key in ("status", "attempts", "elapsed", "retry_after_ms", "challenge", "content_type", "timestamp"):
                  if key in state:
                      record[key] = state[key]
              # Redirect URLs and errors may contain authorization codes. Keep
              # only the host, never URL paths, queries, headers or page bodies.
              for key in ("url", "finalUrl", "pageUrl"):
                  if state.get(key):
                      record[key + "_host"] = urlsplit(state[key]).hostname
              records.append(record)
          destination = Path(os.environ["RUNNER_TEMP"]) / "docs-navigation-summary.json"
          destination.write_text(json.dumps(records, indent=2))
          PYNAV

      - name: Save failed browser control diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-browser-control-logs
          # Nested pytest output omits this observer log. Allow only reviewed
          # control diagnostics, never persona files or raw network logs.
          path: |
            ${{ runner.temp }}/docs-pytest/**/snap/test-snapshot/chrome/canva-observer.stderr.log
            ${{ runner.temp }}/docs-navigation-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove authentication and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/docs-auth.* "$RUNNER_TEMP/docs-navigation-summary.json"
          rm -rf "$RUNNER_TEMP/docs-personas" "$RUNNER_TEMP/docs-abx-lib" "$RUNNER_TEMP/docs-pytest"

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, documentation]
    if: needs.changes.outputs.changed == 'true' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
