name: Documentation tests

on:
  schedule:
    - cron: '19 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_SOURCES: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  documentation:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Documentation code blocks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Install locked dependencies
        run: |
          uv sync --locked --dev --no-sources --no-cache

      - name: Run documentation code blocks
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/docs-abx-lib
        run: |
          mapfile -t plugin_readmes < <(uv run --no-cache --no-project python - <<'PY'
          from pathlib import Path

          for readme in sorted(Path("abx_plugins/plugins").glob("*/README.md")):
              print(readme)
          PY
          )
          uv run --no-cache --no-sync --no-sources pytest -vv --tb=long \
            README.md AGENTS.md skills docs "${plugin_readmes[@]}"

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, documentation]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
