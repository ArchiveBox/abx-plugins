name: Documentation tests

on:
  schedule:
    - cron: '19 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_SOURCES: '1'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  documentation:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main'
    name: Documentation code blocks
    runs-on: ubuntu-24.04
    environment: provider-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Install browser display and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Install locked dependencies
        run: |
          uv sync --locked --dev --no-sources --no-cache

      - name: Install the documentation downloader CLI
        run: |
          uv tool install --python 3.13 abx-dl==1.13.152
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "ABX_PLUGINS_DIR=$GITHUB_WORKSPACE/abx_plugins/plugins" >> "$GITHUB_ENV"

      - name: Install the matching Chrome sandbox helper
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/docs-abx-lib
        run: |
          chrome_sandbox="$(uv run --no-cache --no-sync --no-sources python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import abx_plugins

          config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
          env = json.loads(subprocess.check_output([
              "abxpkg", "env", "--install", "--json",
              f"--deps-from={config}:required_binaries", "browsers",
          ], text=True))
          helper = Path(env["CHROME_BINARY"]).resolve(strict=True).with_name("chrome_sandbox")
          assert helper.is_file(), helper
          print(helper)
          PY
          )"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # GPU-less CI needs an explicit OpenGL ES renderer for Figma.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader"]' >> "$GITHUB_ENV"
      - name: Prepare authorized provider persona
        env:
          PROVIDER_AUTH_STORAGE_JSON: ${{ secrets.PROVIDER_AUTH_STORAGE_JSON }}
        run: |
          set -Eeuo pipefail
          : "${PROVIDER_AUTH_STORAGE_JSON:?Missing provider-capture authentication secret}"
          umask 077
          auth_file="$(mktemp --suffix=.json "$RUNNER_TEMP/docs-auth.XXXXXX")"
          printf '%s' "$PROVIDER_AUTH_STORAGE_JSON" > "$auth_file"
          chmod 600 "$auth_file"
          {
            echo "AUTH_STORAGE_FILE=$auth_file"
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/docs-abx-lib"
            echo "PERSONAS_DIR=$RUNNER_TEMP/docs-personas"
          } >> "$GITHUB_ENV"
      - name: Run documentation code blocks
        env:
          CHROME_HEADLESS: "false"
        run: |
          mapfile -t plugin_readmes < <(uv run --no-cache --no-project python - <<'PY'
          from pathlib import Path

          for readme in sorted(Path("abx_plugins/plugins").glob("*/README.md")):
              print(readme)
          PY
          )
          test -f "$AUTH_STORAGE_FILE"
          xvfb-run -a uv run --no-cache --no-sync --no-sources pytest -vv --tb=long \
            README.md AGENTS.md skills docs "${plugin_readmes[@]}"

      - name: Remove authentication and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/docs-auth.*
          rm -rf "$RUNNER_TEMP/docs-personas" "$RUNNER_TEMP/docs-abx-lib"

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, documentation]
    if: needs.changes.outputs.changed == 'true' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
