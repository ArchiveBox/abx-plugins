name: Release candidate

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-main
  cancel-in-progress: false

jobs:
  artifacts:
    name: Prepare, build, and smoke-test release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - id: version
        uses: ArchiveBox/monorepo/.github/actions/prepare-release-version@main
        with:
          package: abx-plugins
          branch: main
          tag-prefix: v
          version-scheme: patch

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Build and smoke-test the wheel
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        shell: bash
        run: |
          set -Eeuo pipefail
          uv build --no-cache --no-sources --out-dir dist --clear
          wheel=(dist/abx_plugins-*.whl)
          uv sync --locked --no-cache --no-sources --no-dev --no-install-project
          uv pip install --no-cache --no-deps --python .venv/bin/python "${wheel[0]}"
          smoke_dir="$(mktemp -d)"
          (cd "$smoke_dir" && VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" uv run --no-cache --active --no-project python -c 'import abx_plugins; from abx_plugins.plugins import title')
          DIST_DIR=dist uv run --no-cache --no-project python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["DIST_DIR"])
          paths = sorted((*root.glob("*.whl"), *root.glob("*.tar.gz")))
          (root / "SHA256SUMS").write_text("".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in paths))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved'
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
