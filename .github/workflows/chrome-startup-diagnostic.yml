name: Diagnose native Chrome disk stalls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preload: [false, true]
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.3'
          enable-cache: false
      - name: Compare real cold native browser startup
        env:
          PRELOAD: ${{ matrix.preload }}
        run: |
          uv run --no-project python - <<'PY'
          import concurrent.futures, json, os, pathlib, shutil, signal, socket, subprocess, tempfile, time, urllib.request
          binary = pathlib.Path(shutil.which('chromium')).resolve()
          print('binary', binary, 'size', binary.stat().st_size, flush=True)
          args = json.loads(pathlib.Path('abx_plugins/plugins/chrome/config.json').read_text())['properties']['CHROME_ARGS']['default']
          started = time.monotonic()
          if os.environ['PRELOAD'] == 'true':
              with binary.open('rb') as stream:
                  while stream.read(4 * 1024 * 1024):
                      pass
          print('sequential_read_seconds', time.monotonic() - started, flush=True)
          def trial(index):
              root = pathlib.Path(tempfile.mkdtemp())
              with socket.socket() as sock:
                  sock.bind(('127.0.0.1', 0))
                  port = sock.getsockname()[1]
              with (root / 'stderr.log').open('w') as stderr:
                  started = time.monotonic()
                  process = subprocess.Popen([str(binary), *args, '--headless=new', '--no-sandbox', '--disable-dev-shm-usage', f'--remote-debugging-port={port}', f'--user-data-dir={root}/profile', 'about:blank'], stdout=subprocess.DEVNULL, stderr=stderr, start_new_session=True)
                  ready = False
                  try:
                      while time.monotonic() - started < 30:
                          try:
                              with urllib.request.urlopen(f'http://127.0.0.1:{port}/json/version', timeout=.5) as response:
                                  ready = bool(json.load(response)['webSocketDebuggerUrl'])
                              break
                          except (OSError, ValueError):
                              time.sleep(.05)
                      state = {name: pathlib.Path(f'/proc/{process.pid}/{name}').read_text() for name in ('stat', 'wchan', 'syscall') if pathlib.Path(f'/proc/{process.pid}/{name}').exists()}
                      print(json.dumps({'trial': index, 'ready': ready, 'seconds': time.monotonic() - started, 'state': state}), flush=True)
                  finally:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      print((root / 'stderr.log').read_text()[-1500:], flush=True)
                  return ready
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results = list(pool.map(trial, range(2)))
          assert all(results), results
          PY
