name: Live Provider Tests

# External sessions and provider availability remain real checks (exhausted
# paid API credits produce warnings through the shared classifier), but
# are independent of Parallel Tests and its release/cascade success gate.
on:
  schedule:
    - cron: '47 4,12,20 * * *'
  workflow_dispatch:
    inputs:
      run_paid_captcha:
        description: Run a real, potentially billed 2Captcha solve
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONLEGACYWINDOWSSTDIO: utf-8
  USE_COLOR: False
  UV_NO_SOURCES: "1"

jobs:
  prepare:
    if: github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      provider-matrix: ${{ steps.matrix.outputs.provider-matrix }}
      public-provider-matrix: ${{ steps.matrix.outputs.public-provider-matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - id: matrix
        env:
          CI_TEST_EVENT: ${{ github.event_name }}
          CI_RUN_PAID_CAPTCHA: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid_captcha == true }}
        run: uv run --no-cache --no-project python .github/ci_test_matrix.py >> "$GITHUB_OUTPUT"

  provider-capture:
    name: Authenticated provider / ${{ matrix.test.path }}
    needs: prepare
    if: needs.prepare.outputs.provider-matrix != '[]' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # A required egress must not fall back to a different network. This job is
    # restricted to main above; public PR code never runs on private runners.
    runs-on: ${{ matrix.test.ugnas && fromJSON('["self-hosted","ugnas-linux"]') || matrix.test.os }}
    environment: provider-capture
    env:
      # ugNAS workers are unprivileged Docker containers; their seccomp policy
      # cannot create the namespaces required by Chrome's setuid sandbox.
      IN_DOCKER: ${{ matrix.test.ugnas && 'true' || 'false' }}
      CHROME_SANDBOX: ${{ matrix.test.ugnas && 'false' || 'true' }}
      # Keep normal software 2D rendering for these trusted public fixtures.
      CHROME_ARGS_EXTRA: '["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]'
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.prepare.outputs.provider-matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Use the standard Ubuntu archive on hosted Linux
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Prefer the public archive over the remaining cloud-local mirror.
          # The Azure mirror can trickle bytes indefinitely without triggering
          # APT's stall timeout: https://github.com/actions/runner-images/issues/14823
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
            sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
          fi
      - name: Install browser display and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils
      - name: Install locked test dependencies
        run: uv sync --locked --dev --no-sources --no-cache
      - name: Install the matching Chrome sandbox helper
        if: runner.environment == 'github-hosted'
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/provider-runtime
        run: |
          chrome_sandbox="$(uv run --no-cache --no-sync --no-sources python .github/ci_chrome_sandbox.py)"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
      - name: Prepare authorized provider persona
        if: "!matrix.test.paid_captcha && !contains(matrix.test.path, '/ytdlp/')"
        env:
          # Refresh each provider independently without replacing other sessions.
          PROVIDER_AUTH_STORAGE_JSON: ${{ contains(matrix.test.path, '/figma/') && secrets.FIGMA_AUTH_STORAGE_JSON || contains(matrix.test.path, '/canva/') && secrets.CANVA_AUTH_STORAGE_JSON || secrets.PROVIDER_AUTH_STORAGE_JSON }}
        run: |
          set -Eeuo pipefail
          : "${PROVIDER_AUTH_STORAGE_JSON:?Missing provider-capture authentication secret}"
          umask 077
          auth_file="$(mktemp --suffix=.json "$RUNNER_TEMP/provider-auth.XXXXXX")"
          printf '%s' "$PROVIDER_AUTH_STORAGE_JSON" > "$auth_file"
          chmod 600 "$auth_file"
          {
            echo "AUTH_STORAGE_FILE=$auth_file"
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/provider-runtime"
            echo "PERSONAS_DIR=$RUNNER_TEMP/provider-personas"
          } >> "$GITHUB_ENV"
      - name: Prepare authorized media cookies
        if: contains(matrix.test.path, '/ytdlp/')
        env:
          SUBSTACK_COOKIES_TXT: ${{ secrets.SUBSTACK_COOKIES_TXT }}
        run: |
          set -Eeuo pipefail
          # CLI media downloaders consume the persona's Netscape export, not
          # browser auth.json. Keep this provider separate from the other secrets.
          : "${SUBSTACK_COOKIES_TXT:?Missing provider-capture Substack cookies}"
          umask 077
          cookies_file="$(mktemp "$RUNNER_TEMP/provider-cookies.XXXXXX")"
          printf '%s' "$SUBSTACK_COOKIES_TXT" > "$cookies_file"
          {
            echo "COOKIES_FILE=$cookies_file"
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/provider-runtime"
          } >> "$GITHUB_ENV"
      - name: Run real authenticated provider acceptance
        if: "!matrix.test.paid_captcha"
        env:
          TEST_PATH: ${{ matrix.test.path }}
          CHROME_HEADLESS: "false"
        run: |
          set -Eeuo pipefail
          test -f "${COOKIES_FILE:-${AUTH_STORAGE_FILE:-}}"
          test -f "$TEST_PATH"
          xvfb-run -a uv run --no-cache --no-sync --no-sources pytest -q "$TEST_PATH" \
            --basetemp="$RUNNER_TEMP/provider-pytest" \
            --junitxml="$RUNNER_TEMP/provider-pytest/results.xml" \
            -o cache_dir="$RUNNER_TEMP/provider-pytest-cache"
      - name: Run explicitly approved paid 2Captcha solve
        if: matrix.test.paid_captcha && github.event_name == 'workflow_dispatch' && inputs.run_paid_captcha == true
        env:
          TEST_PATH: ${{ matrix.test.path }}
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          CHROME_HEADLESS: "false"
          ABXPKG_LIB_DIR: ${{ runner.temp }}/provider-runtime
          PERSONAS_DIR: ${{ runner.temp }}/provider-personas
        run: |
          set -Eeuo pipefail
          test -f "$TEST_PATH"
          xvfb-run -a uv run --no-cache --no-sync --no-sources pytest -q "$TEST_PATH" \
            --basetemp="$RUNNER_TEMP/provider-pytest" \
            -o cache_dir="$RUNNER_TEMP/provider-pytest-cache"
      - name: Save failed public export evidence
        if: failure() && !matrix.test.paid_captcha
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-exports-${{ strategy.job-index }}
          # Public fixture exports and test diagnostics; never upload personas or cookies.
          path: |
            ${{ runner.temp }}/provider-pytest/results.xml
            ${{ runner.temp }}/provider-pytest/**/crawl/test-crawl/chrome/*.stdout.log
            ${{ runner.temp }}/provider-pytest/**/crawl/test-crawl/chrome/*.stderr.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/chrome/*.stdout.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/chrome/*.stderr.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/*/downloads.json
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/*/files/*
            ${{ runner.temp }}/provider-pytest/**/exported-frame-*.jpg
            ${{ runner.temp }}/provider-pytest/**/exported-*.ppm
            ${{ runner.temp }}/provider-pytest/**/exported-sticky-ocr.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove authentication and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/provider-auth.* "$RUNNER_TEMP"/provider-cookies.*
          rm -rf "$RUNNER_TEMP/provider-pytest" "$RUNNER_TEMP/provider-personas" \
            "$RUNNER_TEMP/provider-runtime" "$RUNNER_TEMP/provider-pytest-cache"

  public-providers:
    name: ${{ matrix.test.api && 'API' || 'Public' }} provider / ${{ matrix.test.path }}
    needs: prepare
    if: needs.prepare.outputs.public-provider-matrix != '[]' && github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # Public and model API fixtures never receive a browser persona.
      AUTH_STORAGE_FILE: ""
      COOKIES_FILE: ""
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.prepare.outputs.public-provider-matrix) }}
    steps:
      - name: Set up Squid
        if: >-
          github.repository == 'ArchiveBox/abx-plugins' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ArchiveBox/monorepo/.github/actions/setup-squid@eeae1fd64ddeefc27f7d32a26d483b7a894d7915
        with:
          proxy: ${{ vars[runner.environment == 'self-hosted' && 'SQUID_LAN_URL' || 'SQUID_TAILNET_URL'] }}
          ca: ${{ vars.SQUID_CA }}
          tailscale-client-id: ${{ vars.SQUID_TAILSCALE_CLIENT_ID }}
          tailscale-audience: ${{ vars.SQUID_TAILSCALE_AUDIENCE }}
          browser: 'true'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Prepare isolated public runtime
        run: |
          {
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/provider-runtime"
            echo "PERSONAS_DIR=$RUNNER_TEMP/provider-personas"
          } >> "$GITHUB_ENV"
      - name: Use the standard Ubuntu archive on hosted Linux
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Prefer the public archive over the remaining cloud-local mirror.
          # The Azure mirror can trickle bytes indefinitely without triggering
          # APT's stall timeout: https://github.com/actions/runner-images/issues/14823
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
            sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
          fi
      - name: Install browser display and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils
      - name: Install locked test dependencies
        run: uv sync --locked --dev --no-sources --no-cache
      - name: Install the matching Chrome sandbox helper
        if: runner.environment == 'github-hosted'
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/provider-runtime
        run: |
          chrome_sandbox="$(uv run --no-cache --no-sync --no-sources python .github/ci_chrome_sandbox.py)"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
      - name: Run real hosted provider acceptance
        env:
          # Supply only the relevant credential inside its external API test step.
          OPENAI_API_KEY: ${{ matrix.test.api && !contains(matrix.test.path, '/twocaptcha/') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.test.api && !contains(matrix.test.path, '/twocaptcha/') && secrets.ANTHROPIC_API_KEY || '' }}
          TWOCAPTCHA_API_KEY: ${{ matrix.test.api && contains(matrix.test.path, '/twocaptcha/') && secrets.TWOCAPTCHA_API_KEY || '' }}
          TEST_PATH: ${{ matrix.test.path }}
          CHROME_HEADLESS: "false"
        run: |
          set -Eeuo pipefail
          test -f "$TEST_PATH"
          pytest_status=0
          xvfb-run -a uv run --no-cache --no-sync --no-sources pytest -q "$TEST_PATH" \
            --basetemp="$RUNNER_TEMP/provider-pytest" \
            --junitxml="$RUNNER_TEMP/provider-pytest/results.xml" \
            -o cache_dir="$RUNNER_TEMP/provider-pytest-cache" || pytest_status=$?
          uv run --no-project python .github/ci_test_status.py \
            "$RUNNER_TEMP/provider-pytest/results.xml" "$pytest_status"
      - name: Save failed public export evidence
        if: failure() && !matrix.test.api
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-provider-exports-${{ strategy.job-index }}
          # Public fixture exports and test diagnostics; never upload personas or cookies.
          path: |
            ${{ runner.temp }}/provider-pytest/results.xml
            ${{ runner.temp }}/provider-pytest/**/crawl/test-crawl/chrome/*.stdout.log
            ${{ runner.temp }}/provider-pytest/**/crawl/test-crawl/chrome/*.stderr.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/chrome/*.stdout.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/chrome/*.stderr.log
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/*/downloads.json
            ${{ runner.temp }}/provider-pytest/**/snap/test-snapshot/*/files/*
            ${{ runner.temp }}/provider-pytest/**/exported-frame-*.jpg
            ${{ runner.temp }}/provider-pytest/**/exported-*.ppm
            ${{ runner.temp }}/provider-pytest/**/exported-sticky-ocr.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Save API test results
        if: always() && matrix.test.api && !contains(matrix.test.path, '/twocaptcha/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-provider-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/provider-pytest/results.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove authentication and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/provider-auth.* "$RUNNER_TEMP"/provider-cookies.*
          rm -rf "$RUNNER_TEMP/provider-pytest" "$RUNNER_TEMP/provider-personas" \
            "$RUNNER_TEMP/provider-runtime" "$RUNNER_TEMP/provider-pytest-cache"
