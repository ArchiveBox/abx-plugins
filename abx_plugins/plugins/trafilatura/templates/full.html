<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafilatura</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:#faf9f7;min-height:49px}h1{flex:none;font-size:15px;margin:0;white-space:nowrap}nav{display:flex;flex:none;gap:5px;margin-left:auto}nav a{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:5px 8px;text-decoration:none}nav a:hover{background:#f5f2ed}.chooser{display:flex;align-items:center;gap:6px;min-width:0;flex:1}.chooser[hidden]{display:none}.chooser label{color:var(--muted);flex:none}.chooser label span{display:none}.chooser select{min-width:0;max-width:100%;width:260px;padding:6px 24px 6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.format{color:var(--muted);font-size:10px;text-transform:uppercase}main{width:100%;min-width:0;margin:0}article{width:100%;max-width:76ch;margin:0 auto;padding:32px 24px;font:18px/1.68 Georgia,'Times New Roman',serif;overflow-wrap:anywhere}.article-title{margin:0 0 8px;font:700 34px/1.16 Georgia,'Times New Roman',serif;letter-spacing:-.015em}.article-byline{display:flex;align-items:center;flex-wrap:wrap;gap:5px 14px;margin:0 0 14px;color:var(--muted);font:13px/1.4 system-ui,-apple-system,sans-serif}.article-byline a{color:inherit;text-decoration:none;border-bottom:1px solid #cfc8bd}.article-byline a:hover{color:var(--ink)}.article-body{white-space:pre-line}.frontmatter{margin:0 0 18px;border:1px solid var(--line);border-radius:7px;background:#faf9f7;color:var(--ink);font:12px/1.45 system-ui,-apple-system,sans-serif}.frontmatter summary{cursor:pointer;padding:7px 10px;color:var(--muted);font-weight:600}.frontmatter[open] summary{border-bottom:1px solid var(--line)}.frontmatter dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 12px;margin:0;padding:10px}.frontmatter dt{color:var(--muted)}.frontmatter dd{min-width:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted)}@media(max-width:800px){nav .label{display:none}.format{display:none}}@media(max-width:600px){header{gap:6px;padding:4px 8px;min-height:49px}h1{font-size:14px}header:has(.chooser:not([hidden])) .plugin-label{display:none}.chooser label{display:none}.chooser select{width:100%;min-height:36px}nav{gap:3px}nav a{width:40px;height:40px;padding:0}article{max-width:none;padding:20px 16px;font-size:18px;line-height:1.65}.article-title{font-size:30px}.frontmatter dl{grid-template-columns:1fr}.frontmatter dd{margin-bottom:4px}}
</style></head><body>
<header><h1>{{ plugin_icon }} Trafilatura</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main><article id="article"></article></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const asArticleText=(text,pathname)=>{const lower=pathname.toLowerCase();if(lower.endsWith('.html')||lower.endsWith('.htm'))return new DOMParser().parseFromString(text,'text/html').body?.textContent||'';if(lower.endsWith('.xml')||lower.endsWith('.xmltei'))return new DOMParser().parseFromString(text,'application/xml').documentElement?.textContent||'';if(lower.endsWith('.json')){try{const data=JSON.parse(text);return [data.text,data.raw_text,data.body,data.content].find(value=>typeof value==='string'&&value.trim())||text}catch{return text}}return text};
  const parseFrontmatter=text=>{const normalized=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n'),lines=normalized.split('\n');if(lines[0]?.trim()!=='---')return{metadata:[],body:normalized.trim()};const end=lines.findIndex((line,index)=>index>0&&line.trim()==='---');if(end<0)return{metadata:[],body:normalized.trim()};const metadata=[];for(const line of lines.slice(1,end)){const match=line.match(/^([^:#][^:]*?):\s*(.*)$/);if(match)metadata.push({key:match[1].trim(),value:match[2].trim()});else if(metadata.length&&line.trim())metadata[metadata.length-1].value+='\n'+line.trim()}return{metadata,body:lines.slice(end+1).join('\n').trim()}};
  const metadataValue=(metadata,...names)=>{const wanted=names.map(name=>name.toLowerCase());return metadata.find(item=>wanted.includes(item.key.toLowerCase())&&item.value)?.value||''};
  const safeLink=(url,label)=>{const anchor=el('a',label);try{const parsed=new URL(url);if(['http:','https:'].includes(parsed.protocol)){anchor.href=parsed.href;anchor.target='_blank';anchor.rel='noopener noreferrer'}}catch{}return anchor};
  const renderArticle=text=>{const parsed=parseFrontmatter(text),metadata=parsed.metadata,title=metadataValue(metadata,'title'),author=metadataValue(metadata,'author'),date=metadataValue(metadata,'date'),url=metadataValue(metadata,'url','source'),site=metadataValue(metadata,'sitename','site name','hostname');article.replaceChildren();if(title)article.append(el('h2',title,'article-title'));const byline=el('div',null,'article-byline');if(author)byline.append(el('span','✍ '+author));if(site)byline.append(url?safeLink(url,'↗ '+site):el('span','↗ '+site));else if(url){try{byline.append(safeLink(url,'↗ '+new URL(url).hostname.replace(/^www\./,'')))}catch{}}if(date)byline.append(el('span','◷ '+date));if(byline.childElementCount)article.append(byline);const promoted=new Set(['title','author','date','url','source','sitename','site name','hostname']),remaining=metadata.filter(item=>item.value&&!promoted.has(item.key.toLowerCase()));if(remaining.length){const details=el('details',null,'frontmatter'),summaryLine=el('summary','Metadata · '+remaining.length);const list=el('dl');for(const item of remaining)list.append(el('dt',item.key),el('dd',item.value));details.append(summaryLine,list);article.append(details)}article.append(el('div',parsed.body,'article-body'));return parsed};
  const loadArticle=async()=>{const textOutput=new URL('content.txt',folder),candidates=output.pathname.endsWith('/content.txt')?[output]:[textOutput,output];for(const candidate of candidates){try{const response=await fetch(rawBytes(candidate));if(!response.ok)continue;const raw=await response.text(),text=asArticleText(raw,candidate.pathname).trim();if(text)return text}catch{}}throw new Error('No readable article output')};
  const article=document.getElementById('article');
  loadArticle().then(renderArticle).catch(()=>{article.textContent='Unable to read extracted article text.';article.className='muted'});
})();
</script></body></html>
