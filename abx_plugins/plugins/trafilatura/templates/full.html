<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafilatura</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:#faf9f7;min-height:49px}h1{flex:none;font-size:15px;margin:0;white-space:nowrap}nav{display:flex;flex:none;gap:5px;margin-left:auto}nav a{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:5px 8px;text-decoration:none}nav a:hover{background:#f5f2ed}.chooser{display:flex;align-items:center;gap:6px;min-width:0;flex:1}.chooser[hidden]{display:none}.chooser label{color:var(--muted);flex:none}.chooser label span{display:none}.chooser select{min-width:0;max-width:100%;width:260px;padding:6px 24px 6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.format{color:var(--muted);font-size:10px;text-transform:uppercase}main{width:100%;min-width:0;margin:0}article{width:100%;max-width:76ch;margin:0 auto;padding:32px 24px;font:18px/1.68 Georgia,'Times New Roman',serif;white-space:pre-line;overflow-wrap:anywhere}.muted{color:var(--muted)}#card-summary{display:none}.badge{display:inline-flex;align-items:center;border:1px solid #e2e6eb;border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:800px){nav .label{display:none}.format{display:none}}@media(max-width:600px){header{gap:6px;padding:4px 8px;min-height:49px}h1{font-size:14px}header:has(.chooser:not([hidden])) .plugin-label{display:none}.chooser label{display:none}.chooser select{width:100%;min-height:36px}nav{gap:3px}nav a{width:40px;height:40px;padding:0}article{max-width:none;padding:20px 16px;font-size:18px;line-height:1.65}}
</style></head><body>
<header><h1>▤ Trafilatura</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main><article id="article"></article></main>
<script>
(() => {
  const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('card-view',compact);
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const asArticleText=(text,pathname)=>{const lower=pathname.toLowerCase();if(lower.endsWith('.html')||lower.endsWith('.htm'))return new DOMParser().parseFromString(text,'text/html').body?.textContent||'';if(lower.endsWith('.xml')||lower.endsWith('.xmltei'))return new DOMParser().parseFromString(text,'application/xml').documentElement?.textContent||'';if(lower.endsWith('.json')){try{const data=JSON.parse(text);return [data.text,data.raw_text,data.body,data.content].find(value=>typeof value==='string'&&value.trim())||text}catch{return text}}return text};
  const loadArticle=async()=>{const textOutput=new URL('content.txt',folder),candidates=output.pathname.endsWith('/content.txt')?[output]:[textOutput,output];for(const candidate of candidates){try{const response=await fetch(rawBytes(candidate));if(!response.ok)continue;const raw=await response.text(),text=asArticleText(raw,candidate.pathname).trim();if(text)return text}catch{}}throw new Error('No readable article output')};
  const summary=document.getElementById('card-summary'),article=document.getElementById('article');loadArticle().then(text=>{const words=text.split(/\s+/).length;article.textContent=text;summary.append(el('span',text),el('span',words+' word'+(words===1?'':'s'),'badge'))}).catch(()=>{article.textContent='Unable to read extracted article text.';article.className='muted'});
})();
</script></body></html>
