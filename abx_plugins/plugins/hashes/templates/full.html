<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hashes</title>
<style>
.folder-meta{display:inline-flex;align-items:center;gap:7px;margin-left:auto;min-width:0}.root-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:12px;white-space:nowrap}@media(max-width:620px){.root-meta{white-space:normal}.tree details>summary{flex-wrap:wrap}.folder-meta{width:calc(100% - 24px);margin-left:24px;flex-wrap:wrap}.folder-meta .badge,.folder-meta .size{flex:none}}
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}.digest{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1px solid #c9d7e6;border-radius:8px;background:#f7fbff}.digest code{font-size:13px;flex:1}.copy{padding:4px 8px;flex:none}.levels{display:flex;align-items:stretch;gap:8px;overflow:auto;padding:4px 1px 8px}.level{min-width:112px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.level strong{display:block;font-size:18px}.arrow{display:grid;place-items:center;color:#94a3b8}.tree,.tree ul{list-style:none;margin:0;padding:0}.tree ul{margin-left:14px;padding-left:14px;border-left:1px solid #dbe3eb}.tree details>summary{cursor:pointer;display:flex;align-items:center;gap:7px;min-height:30px}.tree details>summary::marker{color:#94a3b8}.file{display:grid;grid-template-columns:minmax(160px,1fr) auto minmax(145px,220px);align-items:center;gap:12px;min-height:34px;border-top:1px solid #eef1f4}.file:first-child{border-top:0}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{color:var(--muted);font-variant-numeric:tabular-nums}.hash{display:flex;align-items:center;gap:5px;min-width:0}.hash code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hash button{border:0;background:transparent;padding:2px 3px}.root-label{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:620px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.file{grid-template-columns:minmax(100px,1fr) auto}.hash{grid-column:1/-1}.root-label{align-items:flex-start;flex-direction:column}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>🧬 Hashes</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact = new URLSearchParams(location.search).get('card') === '1';
  document.body.classList.toggle('card-view', compact);
  const output = new URL('{{ output_path|escapejs }}', location.href); output.search=''; output.hash='';
  const folder = new URL('./', output);
  document.getElementById('files').href=folder.href+'?files=1'; document.getElementById('download').href=output.href; document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};
  const summary=document.getElementById('card-summary'),content=document.getElementById('content');
  const formatSize=value=>{let n=Number(value)||0;const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1000&&i<units.length-1){n/=1000;i++}return `${n<10&&i? n.toFixed(1):Math.round(n)} ${units[i]}`};
  const shortHash=value=>{const s=String(value||'');return s.length>20?`${s.slice(0,12)}…${s.slice(-6)}`:s};
  async function copyText(value,button){try{await navigator.clipboard.writeText(value)}catch{const area=el('textarea',value);area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}const old=button.textContent;button.textContent='✓';setTimeout(()=>button.textContent=old,900)}
  function hashControl(value,title=''){const wrap=el('span',null,'hash');if(title)wrap.title=title;const code=el('code',shortHash(value));code.title=String(value||'');const button=el('button','⧉','copy');button.type='button';button.title=title?`Copy full SHA-256 (${title})`:'Copy full SHA-256';button.addEventListener('click',()=>copyText(String(value||''),button));wrap.append(code,button);return wrap}
  function treeFromFiles(files){const root={dirs:new Map(),files:[],order:[]};for(const file of files){const parts=String(file.path||'').split('/').filter(Boolean);let node=root;for(const part of parts.slice(0,-1)){if(!node.dirs.has(part))node.dirs.set(part,{dirs:new Map(),files:[],order:[]});node=node.dirs.get(part)}const item={...file,name:parts.at(-1)||file.path||'(unnamed)'};let cursor=root;cursor.order.push(item);for(const part of parts.slice(0,-1)){cursor=cursor.dirs.get(part);cursor.order.push(item)}node.files.push(item)}return root}
  function folderFiles(node){return node.order}
  function folderStats(node){const files=folderFiles(node);return {count:files.length,size:files.reduce((total,file)=>total+(Number(file.size)||0),0),hashes:files.map(file=>file.hash)}}
  async function merkleRoot(hashes){if(!hashes.length)return '';let level=[...hashes];while(level.length>1){const next=[];for(let i=0;i<level.length;i+=2){const left=level[i],right=level[i+1]||left;const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(left+right));next.push([...new Uint8Array(bytes)].map(byte=>byte.toString(16).padStart(2,'0')).join(''))}level=next}return level[0]}
  async function renderBranch(node,depth=0){const list=el('ul');for(const [name,child] of [...node.dirs].sort(([a],[b])=>a.localeCompare(b))){const li=el('li'),details=el('details');details.open=depth<2;const heading=el('summary'),stats=folderStats(child),folderHash=await merkleRoot(stats.hashes);heading.append(el('span','📁'),el('span',name,'name'));const meta=el('span',null,'folder-meta');meta.append(el('span',`${stats.count} files`,'badge'),el('span',formatSize(stats.size),'size'),hashControl(folderHash,'Derived folder Merkle root'));heading.append(meta);details.append(heading,await renderBranch(child,depth+1));li.append(details);list.append(li)}for(const file of [...node.files].sort((a,b)=>a.name.localeCompare(b.name))){const li=el('li',null,'file');li.title=file.path;li.append(el('span',`📄 ${file.name}`,'name'),el('span',formatSize(file.size),'size'),hashControl(file.hash));list.append(li)}return list}
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(async data=>{
    const meta=data.metadata||{},files=Array.isArray(data.files)?data.files:[];
    summary.append(el('span',`🧬 ${meta.file_count??files.length} files · ${formatSize(meta.total_size)} · ${shortHash(data.root_hash)}`));
    if(compact)return;
    const rootPanel=el('section',null,'panel'),rootLabel=el('div',null,'root-label'),rootMeta=el('span',null,'root-meta');rootMeta.append(el('span',meta.timestamp?new Date(meta.timestamp).toLocaleString():'','muted'),el('span',`📄 ${meta.file_count??files.length} files`),el('span',`◫ ${formatSize(meta.total_size)}`));rootLabel.append(el('h2','Merkle root'),rootMeta);rootPanel.append(rootLabel);
    const digest=el('div',null,'digest');digest.append(el('span','🔐'),el('code',data.root_hash||''));const copy=el('button','⧉ Copy','copy');copy.addEventListener('click',()=>copyText(String(data.root_hash||''),copy));digest.append(copy);rootPanel.append(digest);
    content.append(rootPanel);
    const panel=el('section',null,'panel');panel.append(el('h2','File tree'));const tree=await renderBranch(treeFromFiles(files));tree.className='tree';panel.append(tree);content.append(panel);
  });
})();
</script></body></html>
