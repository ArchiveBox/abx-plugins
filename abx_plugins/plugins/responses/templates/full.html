<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captured responses</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:white;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}#count{color:var(--muted);font-size:12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}main{padding:16px}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.tile{min-width:0;margin:0;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.tile>a{color:inherit;text-decoration:none;display:block;aspect-ratio:1;background:#eceff3}.file-icon{display:flex;height:100%;align-items:center;justify-content:center;font-size:44px}.tile img{display:block;width:100%;height:100%;object-fit:contain}.tile figcaption{padding:7px 9px;font-size:11px;color:var(--muted)}.filename{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}.source{display:flex;justify-content:space-between;gap:6px;margin-top:3px}.file-actions{display:flex;align-items:center;gap:7px;margin-left:auto}.file-download{color:var(--ink);text-decoration:none;font-size:16px;line-height:20px;padding:0 3px}.empty{color:var(--muted);padding:24px;text-align:center}@media(max-width:1100px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}nav .label{display:none}header{padding:8px}nav a{min-width:40px;min-height:40px}main{padding:10px}.gallery{gap:8px}}@media(max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:15px}header{gap:6px}#count{font-size:11px}nav{gap:3px}}
</style></head><body>
<header><h1>Captured responses</h1><span id="count"></span><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main><div id="gallery" class="gallery"></div></main>
<script>
(()=>{
 const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
 const root=new URL(output);const boundary=root.pathname.lastIndexOf('/responses/');root.pathname=boundary>=0?root.pathname.slice(0,boundary+1):new URL('../',output).pathname;
 const files=[{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'responses' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',plugin:'{{ capture.plugin|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }},mime:'{{ info.mimetype|escapejs }}',size:'{{ info.size|escapejs }}'},{% endfor %}{% endif %}{% endfor %}];
 const raw=url=>{const u=new URL(url);u.searchParams.set('raw','1');return u.href};
 document.getElementById('files').href=new URL('responses/?files=1',root).href;document.getElementById('download').href=raw(output);document.getElementById('raw').href=output.href+'?preview=1&raw=1';
 const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
 const gallery=document.getElementById('gallery'),seen=new Set();
 const add=(url,name,label,size,isImage,icon)=>{
  if(seen.has(url))return;seen.add(url);
  const tile=el('figure',null,'tile'),link=el('a');link.href=url;link.title=name;
  if(isImage){const img=el('img');img.src=raw(url);img.alt=name;img.loading='lazy';img.decoding='async';link.append(img)}
  else{const glyph=el('span',icon,'file-icon');glyph.setAttribute('aria-label',label);link.append(glyph)}
  const caption=el('figcaption'),filename=el('span',name,'filename'),meta=el('span',null,'source'),actions=el('span',null,'file-actions');filename.title=name;
  const bytes=Number(size)||0;actions.append(el('span',bytes>=1048576?(bytes/1048576).toFixed(1)+' MB':bytes>=1024?Math.ceil(bytes/1024)+' KB':bytes+' B'));
  const download=el('a','⤓','file-download');download.href=raw(url);download.download=name;download.title='Download '+name;download.setAttribute('aria-label','Download '+name);actions.append(download);
  meta.append(el('span',label),actions);caption.append(filename,meta);tile.append(link,caption);gallery.append(tile);
 };
 const classify=file=>{const mime=file.mime.toLowerCase().split(';')[0],ext=file.path.split('.').pop().toLowerCase();if(mime.startsWith('video/'))return [0,'Video','🎞'];if(mime.startsWith('audio/'))return [1,'Audio','🎵'];if(mime==='application/pdf'||ext==='pdf')return [2,'PDF','📕'];if(mime==='application/epub+zip'||ext==='epub')return [2,'EPUB','📚'];if(/officedocument|opendocument|msword|ms-excel|ms-powerpoint/.test(mime)||['doc','docx','ppt','pptx','xls','xlsx','odt','ods','odp','rtf'].includes(ext))return [2,ext.toUpperCase(),'📄'];if(mime==='text/markdown'||mime==='text/x-markdown'||['md','markdown'].includes(ext))return [2,'Markdown','📄'];if(mime.startsWith('image/'))return [3,'Image','🖼'];if(mime==='text/html'||mime==='application/xhtml+xml'||['html','htm'].includes(ext))return [4,'HTML','🌐'];if((mime.startsWith('application/')&&!/json|xml|javascript|ecmascript|sql|yaml|toml|graphql/.test(mime))||mime.startsWith('font/')||/zip|compressed|archive|font|wasm|executable/.test(mime)||['pdf','zip','gz','tar','7z','rar','woff','woff2','ttf','otf','wasm','bin','exe'].includes(ext))return [5,'Binary','📦'];return [6,['css','js','txt','json','xml','csv'].includes(ext)?ext.toUpperCase():'Text / other','📄']};
 const ordered=files.filter(file=>file.path.replace(/^responses\//,'').startsWith('all/')).sort((a,b)=>classify(a)[0]-classify(b)[0]||(Number(b.size)||0)-(Number(a.size)||0)||a.path.localeCompare(b.path));
 for(const file of ordered){const path=file.path.replace(/^\.\//,'');if(path.startsWith('/')||path.split('/').includes('..'))continue;const relative=file.root?path:file.plugin+'/'+path;const url=new URL(relative.split('/').map(encodeURIComponent).join('/'),root).href;const name=path.split('/').pop();const [rank,label,icon]=classify(file);add(url,name,label,file.size,rank===3,icon)}
 document.getElementById('count').textContent=seen.size+' files';if(!seen.size)gallery.replaceWith(el('p','No captured responses','empty'));
})();
</script></body></html>
