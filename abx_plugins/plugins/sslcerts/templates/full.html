<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSL Certificates</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8;--green:#16805b;--amber:#a45d08;--blue:#326da8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}h3{font-size:14px;margin:0}nav,.actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}nav a,.button,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,.button:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.request{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(180px,.45fr);align-items:center;gap:14px}.request-url{min-width:0;font-weight:600;overflow-wrap:anywhere}.request-arrow{color:var(--muted);font-size:21px}.session{padding:10px 12px;border-radius:8px;background:#edf8f3;border:1px solid #c8e8da;color:#176b50}.chain{max-width:880px;margin:0 auto}.cert{position:relative;border-left:5px solid var(--blue)}.cert.leaf{border-left-color:var(--green)}.cert.intermediate{border-left-color:var(--amber)}.cert.root{border-left-color:#7c5caf}.cert-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}.cert-icon{font-size:24px;line-height:1}.cert-title{min-width:0;flex:1}.cert-title strong{display:block;font-size:16px;overflow-wrap:anywhere}.cert dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 14px;margin:0}.cert dt{color:var(--muted)}.cert dd{margin:0;overflow-wrap:anywhere}.connector{height:32px;width:2px;background:var(--line);margin:-16px auto 0;position:relative}.connector::after{content:'▼';position:absolute;bottom:-8px;left:-7px;color:#94a3b8;font-size:13px}.hash-row{display:flex;align-items:center;gap:7px;min-width:0}.hash-row code{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy{padding:2px 6px;font-size:11px;flex:none}.sans{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.empty{padding:40px;text-align:center;color:var(--muted)}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:620px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.request{grid-template-columns:1fr}.request-arrow{transform:rotate(90deg);justify-self:center}.cert dl{grid-template-columns:1fr}.cert dd{margin-bottom:5px}.cert-head{flex-wrap:wrap}.actions{width:100%;margin-left:34px}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>🔒 SSL Certificates</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact = new URLSearchParams(location.search).get('card') === '1';
  document.body.classList.toggle('card-view', compact);
  const output = new URL('{{ output_path|escapejs }}', location.href); output.search=''; output.hash='';
  const folder = new URL('./', output), snapshotRoot = new URL('../', folder);
  document.getElementById('files').href = folder.href + '?files=1';
  document.getElementById('download').href = output.href;
  document.getElementById('raw').href = output.href + '?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  const fmtDate=value=>{const n=Number(value);const date=new Date(Number.isFinite(n)&&n<1e12?n*1000:value);return Number.isNaN(date.valueOf())?String(value||'—'):date.toLocaleString()};
  const parseJsonl=text=>text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).flatMap(line=>{try{return[JSON.parse(line)]}catch{return[]}});
  const pathLink=value=>{if(!value||typeof value!=='string'||value.includes('..')||/^[a-z]+:/i.test(value))return null;const clean=value.replace(/^\/+/, '');return clean.startsWith('sslcerts/')?new URL(clean,snapshotRoot):new URL(clean,folder)};
  const roleInfo=role=>({leaf:['🔐','Website certificate'],intermediate:['🔗','Intermediate certificate'],root:['⚓','Root certificate']}[role]||['📜','Certificate']);
  const summary=document.getElementById('card-summary'),content=document.getElementById('content');
  const appendCopy=(parent,value)=>{const row=el('span',null,'hash-row'),code=el('code',value),button=el('button','Copy','copy');button.type='button';button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(String(value));button.textContent='Copied'}catch{button.textContent='Select';const selection=getSelection();const range=document.createRange();range.selectNodeContents(code);selection.removeAllRanges();selection.addRange(range)}});row.append(code,button);parent.append(row)};
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(text=>{
    const records=parseJsonl(text);const first=records[0]||{};const chains=records.reduce((n,r)=>n+(Array.isArray(r.certificateChain)?r.certificateChain.length:0),0);
    summary.append(el('span',first.subjectName||first.url||'TLS certificate'),el('span',first.protocol||'TLS','badge'),el('span',(chains||records.length)+' cert'+((chains||records.length)===1?'':'s'),'badge'));
    if(compact)return;
    records.forEach((record,recordIndex)=>{
      const top=el('section',null,'panel request');
      const request=el('div');request.append(el('div','🌐 Captured request','muted'),safeLink(record.url,record.url||'Unknown request'));request.lastElementChild.classList.add('request-url');
      const session=el('div',null,'session');session.append(el('strong','🔒 '+(record.protocol||record.securityState||'Secure session')));if(record.cipher)session.append(el('div',record.cipher,'mono'));if(record.keyExchangeGroup||record.keyExchange)session.append(el('div',record.keyExchangeGroup||record.keyExchange,'muted'));
      top.append(request,el('div','→','request-arrow'),session);content.append(top);
      const chain=Array.isArray(record.certificateChain)&&record.certificateChain.length?record.certificateChain:[{position:'leaf',commonName:record.subjectName,issuerText:record.issuer,validFrom:record.validFrom,validTo:record.validTo,fingerprint256:record.leafFingerprint256,pemPath:record.leafPemPath,ctSearchUrl:record.leafCtSearchUrl,subjectAltName:Array.isArray(record.subjectAlternativeNames)?record.subjectAlternativeNames.join(', '):''}];
      const chainWrap=el('section',null,'chain');
      chain.forEach((cert,index)=>{
        const role=cert.position||((index===0)?'leaf':(index===chain.length-1?'root':'intermediate')),info=roleInfo(role);
        const card=el('article',null,'panel cert '+role),head=el('div',null,'cert-head'),icon=el('span',info[0],'cert-icon'),title=el('div',null,'cert-title');
        title.append(el('strong',cert.commonName||cert.subjectText||record.subjectName||'Unnamed certificate'),el('span',info[1],'muted'));
        const actions=el('div',null,'actions'),pem=pathLink(cert.pemPath);
        if(pem){const link=el('a','⤓ PEM','button');link.href=pem.href;link.download='';actions.append(link)}
        let ct=cert.ctSearchUrl;if(!ct&&/^[a-f0-9:]{32,}$/i.test(cert.fingerprint256||''))ct='https://crt.sh/?q='+encodeURIComponent(String(cert.fingerprint256).replace(/:/g,''));
        if(ct)actions.append(safeLink(ct,'◫ CT logs'));head.append(icon,title,actions);card.append(head);
        const fields=el('dl');
        const add=(label,value,kind)=>{if(value===undefined||value===null||value==='')return;fields.append(el('dt',label));const dd=el('dd');if(kind==='hash')appendCopy(dd,value);else dd.textContent=kind==='date'?fmtDate(value):String(value);fields.append(dd)};
        add('Subject',cert.subjectText||cert.commonName);add('Issuer',cert.issuerText||cert.issuerCommonName||record.issuer);add('Valid from',cert.validFrom,'date');add('Valid until',cert.validTo,'date');add('Serial',cert.serialNumber,'hash');add('SHA-256',cert.fingerprint256||((index===0)&&record.leafFingerprint256),'hash');fields.childElementCount&&card.append(fields);
        const sans=String(cert.subjectAltName||'').replace(/^DNS:/,'').split(/,\s*DNS:/).filter(Boolean);if(!sans.length&&index===0&&Array.isArray(record.subjectAlternativeNames))sans.push(...record.subjectAlternativeNames);if(sans.length){const list=el('div',null,'sans');sans.forEach(name=>list.append(el('span','⌁ '+name,'badge')));card.append(list)}
        chainWrap.append(card);if(index<chain.length-1)chainWrap.append(el('div',null,'connector'));
      });content.append(chainWrap);
      const facts=el('div',null,'badges');[['CT',record.certificateTransparencyCompliance],['Signature',record.serverSignatureAlgorithm],['ECH',typeof record.encryptedClientHello==='boolean'?(record.encryptedClientHello?'yes':'no'):'']].forEach(([label,value])=>{if(value!==''&&value!=null)facts.append(el('span',label+' · '+value,'badge'))});if(facts.childElementCount)content.append(facts);
      if(recordIndex<records.length-1)content.append(el('hr'));
    });
  }).catch(()=>content.append(el('div','Unable to read certificate data.','panel empty')));
})();
</script></body></html>
