<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dropbox downloads</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font: 14px/1.5 system-ui, sans-serif;
        color: #273449;
        background: #f4f6f9;
      }
      header {
        background: white;
        border-bottom: 1px solid #dfe5ed;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 650;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-left: auto;
      }
      a {
        color: #285ec7;
        text-decoration: none;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #dbe2ed;
        border-radius: 6px;
        padding: 6px 10px;
        background: #fff;
        font-size: 12px;
      }
      nav a:hover {
        background: #eef4ff;
        border-color: #9ab5e5;
      }
      main {
        max-width: 1000px;
        margin: 34px auto;
        padding: 0 20px;
      }
      .summary {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }
      .folder {
        font-size: 50px;
        background: #e8efff;
        border: 1px solid #d4e0fb;
        border-radius: 18px;
        padding: 12px 20px;
      }
      h2 {
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 8px;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #6c788c;
      }
      .panel {
        background: #fff;
        border: 1px solid #dce3ec;
        border-radius: 10px;
        overflow: hidden;
      }
      .panel-title {
        padding: 13px 18px;
        background: #f9fafc;
        border-bottom: 1px solid #e5eaf1;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .download {
        padding: 20px;
        border-bottom: 1px solid #e9edf3;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
      }
      .download:last-child {
        border: 0;
      }
      .badge {
        background: #edf3ff;
        color: #315d9e;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        font-weight: 700;
      }
      .name {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
        margin-bottom: 5px;
      }
      .size {
        font-size: 12px;
        color: #6c788c;
      }
      .hash {
        margin-top: 12px;
        font: 11px/1.6 ui-monospace, monospace;
        color: #7b8797;
        overflow-wrap: anywhere;
      }
      .download-button {
        border: 1px solid #dce3ec;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .note {
        margin-top: 16px;
        color: #6c788c;
        font-size: 12px;
      }
      #error {
        color: #b42318;
      }
      @media (max-width: 580px) {
        header {
          padding: 12px;
        }
        nav {
          margin-left: 0;
        }
        main {
          margin: 22px auto;
          padding: 0 12px;
        }
        .folder {
          display: none;
        }
        h2 {
          font-size: 19px;
        }
        .download {
          padding: 14px;
          gap: 10px;
        }
        .hash {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body data-output="{{ output_path }}">
    <header>
      <h1>{{ plugin_icon }} Dropbox</h1>
      <nav id="actions" aria-label="Output actions">
        <a id="files">📁 View all files</a><a id="raw">&lt;/&gt; View raw</a>
      </nav>
    </header>
    <main>
      <div class="summary">
        <div class="folder" aria-hidden="true">📦</div>
        <div>
          <h2 id="title">Saved downloads</h2>
          <div class="muted" id="subtitle">Loading download details…</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">
          <span>Archived files</span><span id="total" class="muted"></span>
        </div>
        <div id="downloads"></div>
      </div>
      <p class="note">
        Folder ZIPs preserve the contents and structure supplied by the
        provider’s download feature.
      </p>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const output = new URL(document.body.dataset.output, document.baseURI);
      output.search = "";
      output.hash = "";
      const folder = new URL("./", output);
      document.getElementById("files").href = folder.href + "?files=1";
      const raw = new URL(output);
      raw.searchParams.set("raw", "1");
      document.getElementById("raw").href = raw.href;
      const bytes = (n) =>
        n < 1024
          ? n + " B"
          : n < 1048576
          ? (n / 1024).toFixed(1) + " KB"
          : n < 1073741824
          ? (n / 1048576).toFixed(1) + " MB"
          : (n / 1073741824).toFixed(2) + " GB";
      fetch(raw)
        .then((r) => {
          if (!r.ok) throw Error("Download details unavailable");
          return r.json();
        })
        .then((manifest) => {
          document.getElementById("title").textContent =
            manifest.title || "Saved downloads";
          const files = (manifest.downloads || []).filter((item) =>
            /^download-\d+(?:\.[a-zA-Z0-9]+)?$/.test(item.path)
          );
          if (!files.length) throw Error("No completed downloads recorded");
          document.getElementById("subtitle").textContent =
            files.length === 1
              ? "1 saved download"
              : files.length + " saved downloads";
          document.getElementById("total").textContent = bytes(
            files.reduce((n, f) => n + f.size, 0)
          );
          for (const [i, file] of files.entries()) {
            const url = new URL(file.path, folder);
            url.searchParams.set("raw", "1");
            const action = document.createElement("a");
            action.href = url.href;
            action.download = file.filename;
            action.textContent =
              files.length > 1
                ? file.format.toUpperCase() + " " + (i + 1)
                : file.format.toUpperCase();
            document
              .getElementById("actions")
              .insertBefore(action, document.getElementById("files"));
            const row = document.createElement("div");
            row.className = "download";
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = file.format.toUpperCase();
            const info = document.createElement("div");
            const name = document.createElement("a");
            name.className = "name";
            name.href = url.href;
            name.download = file.filename;
            name.textContent = file.filename;
            const size = document.createElement("div");
            size.className = "size";
            size.textContent = bytes(file.size);
            const hash = document.createElement("div");
            hash.className = "hash";
            hash.textContent = "SHA-256 " + file.sha256;
            info.append(name, size, hash);
            const download = document.createElement("a");
            download.href = url.href;
            download.download = file.filename;
            download.className = "download-button";
            download.textContent = "↓ Download";
            row.append(badge, info, download);
            document.getElementById("downloads").append(row);
          }
        })
        .catch((error) => {
          document.getElementById("subtitle").textContent = "";
          document.getElementById("error").textContent = error.message;
        });
    </script>
  </body>
</html>
