<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package registry</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#1f2328;font:14px/1.5 var(--font-family-primary, system-ui, sans-serif)}header{background:#fff;border-bottom:1px solid #d1d9e0;padding:16px 24px}header strong{font-size:17px}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:25px 0 10px}.meta{color:#59636e}.badge{display:inline-block;margin-left:8px;padding:2px 8px;border:1px solid #d1d9e0;border-radius:12px;font-size:12px}.files{background:#fff;border:1px solid #d1d9e0;border-radius:6px}.file{display:flex;gap:12px;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee;overflow-wrap:anywhere}.file:last-child{border:0}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d1d9e0;border-radius:6px;padding:16px;font:13px/1.5 ui-monospace,monospace}@media(max-width:600px){main{padding:16px}header{padding:12px 16px}}
</style></head><body><header><strong>📦 Package Registry</strong></header><main id="content">Loading package…</main><script>
(()=>{const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};fetch(output).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{const main=document.getElementById('content');main.replaceChildren();const title=el('h1',data.name);title.append(el('span',data.version,'badge'));main.append(title,el('p',data.registry,'meta'),el('p',data.description||''));const source=el('a','Original package');try{const url=new URL(data.source_url);if(['http:','https:'].includes(url.protocol)){source.href=url.href;source.rel='noopener noreferrer';main.append(source)}}catch{}main.append(el('h2','Distribution files'));const files=el('div',null,'files');for(const f of data.files||[]){const row=el('div',null,'file'),link=el('a',f.filename);link.href=new URL(encodeURIComponent(f.filename),output).href;row.append(link,el('span',(f.size/1024).toFixed(1)+' KiB','meta'));files.append(row)}main.append(files);if(data.readme){main.append(el('h2','README'),el('pre',data.readme))}const raw=el('p');const link=el('a','Registry metadata');link.href=new URL('registry.json',output).href;raw.append(link);main.append(raw)}).catch(()=>{document.getElementById('content').textContent='Unable to read package metadata.'})})();
</script></body></html>
