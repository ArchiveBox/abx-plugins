<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD/3D assets</title>
<style>:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}nav{margin-left:auto;display:flex;gap:6px}a{color:var(--accent)}nav a{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:white;color:var(--ink);text-decoration:none}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.asset{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.glyph{font-size:32px}.name{display:block;font-weight:650;margin:8px 0;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px}.source{display:block;margin-top:9px;overflow-wrap:anywhere;font-size:11px}.empty{color:var(--muted);padding:24px;text-align:center}#summary{color:var(--muted);font-size:12px}#card-summary{display:none}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;height:20px;padding:0 8px;font-size:11px;color:var(--muted)}</style></head>
<body><header><h1>🧊 CAD/3D assets</h1><span id="summary"></span><nav><a id="files">📁 Files</a><a id="raw">&lt;/&gt;</a></nav></header><div id="card-summary"></div><main><div id="assets" class="grid"></div></main>
<script>(()=>{const compact=new URLSearchParams(location.search).get("card")==="1";document.body.classList.toggle("card-view",compact);const output=new URL("{{ output_path|escapejs }}",location.href);output.search="";output.hash="";const folder=new URL("./",output);document.getElementById("files").href=folder.href+"?files=1";document.getElementById("raw").href=output.href+"?preview=1&raw=1";const size=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":n>=1024?Math.ceil(n/1024)+" KB":n+" B";const safeFile=name=>String(name).split("/").every(part=>part&&part!=="."&&part!=="..");fetch(output).then(r=>r.ok?r.json():Promise.reject(new Error(r.status))).then(data=>{const assets=Array.isArray(data.assets)?data.assets:[];document.getElementById("summary").textContent=assets.length+" asset"+(assets.length===1?"":"s");document.getElementById("card-summary").textContent="🧊 "+assets.length+" asset"+(assets.length===1?"":"s");if(compact)return;const root=document.getElementById("assets");for(const asset of assets){if(!safeFile(asset.filename))continue;const card=document.createElement("article");card.className="asset";const glyph=document.createElement("div");glyph.className="glyph";glyph.textContent="🧊";const link=document.createElement("a");link.className="name";link.textContent=asset.filename;link.href=new URL("assets/"+asset.filename.split("/").map(encodeURIComponent).join("/"),folder).href;link.download=asset.filename;const meta=document.createElement("div");meta.className="meta";meta.textContent=size(Number(asset.size)||0);const source=document.createElement("a");source.className="source";source.textContent=asset.url;source.href=asset.url;source.target="_blank";source.rel="noopener noreferrer";card.append(glyph,link,meta,source);root.append(card)}if(!root.childElementCount)root.innerHTML='<p class="empty">No CAD/3D assets found</p>'}).catch(error=>{document.getElementById("assets").innerHTML='<p class="empty">Unable to read asset manifest: '+String(error.message)+'</p>'})})();</script></body></html>
