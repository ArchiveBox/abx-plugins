<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenDataLoader</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff;--bg:#f5f3ef}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}nav{display:flex;gap:6px;margin-left:auto}nav a{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:6px 9px;text-decoration:none}nav a:hover{background:#f5f2ed}main{width:min(72rem,calc(100% - 32px));margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(48,42,34,.05)}.chooser{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}.chooser[hidden]{display:none}.chooser label{font-weight:600;white-space:nowrap}.chooser select{min-width:0;max-width:100%;padding:6px 28px 6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.format{margin-left:auto;padding:2px 7px;border:1px solid var(--line);border-radius:5px;background:#f7f5f2;font-size:11px;text-transform:uppercase}article{max-width:72ch;margin:0 auto;padding:clamp(28px,6vw,72px);font:18px/1.68 Georgia,'Times New Roman',serif;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted)}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;border:1px solid #e2e6eb;border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:500px){header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 12px}h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav{margin:0;flex:none}nav a{width:40px;height:40px;padding:0}.label{display:none}main{width:100%;margin:0;border:0;border-radius:0;box-shadow:none}.chooser{padding:10px 12px}.chooser label span{display:none}.format{display:none}article{padding:24px 20px;font-size:17px;line-height:1.65}}
</style></head><body>
<header><h1>▥ OpenDataLoader</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main><div id="chooser" class="chooser" hidden><label for="document">📄 <span>View</span></label><select id="document"></select><span id="format" class="format"></span></div><article id="article"></article></main>
<script>
(() => {
  const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('card-view',compact);
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
  const rawPath='{{ output_path_raw|escapejs }}',plugin='{{ plugin|default:"opendataloader"|escapejs }}';
  const rawParts=rawPath.split('/').filter(Boolean),pluginIndex=rawParts.lastIndexOf(plugin),trailing=pluginIndex>=0?rawParts.length-pluginIndex-1:1;let pluginRoot=new URL('./',output);for(let i=1;i<trailing;i++)pluginRoot=new URL('../',pluginRoot);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=pluginRoot.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const knownFiles=[{% for file_path, file_info in result.output_files.items %}'{{ file_path|escapejs }}',{% endfor %}];
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeFile=value=>{if(typeof value!=='string'||!value||value.includes('..')||/^[a-z]+:/i.test(value))return null;let parts=value.split('/').filter(Boolean);if(parts[0]===plugin)parts=parts.slice(1);if(!parts.length)return null;return new URL(parts.map(encodeURIComponent).join('/'),pluginRoot)};
  const readable=knownFiles.filter(path=>/\.(txt|md|json)$/i.test(path)),primaryName=decodeURIComponent(output.pathname.split('/').pop()||'output');if(!readable.some(path=>path.split('/').pop()===primaryName))readable.unshift(primaryName);
  const files=[...new Set(readable)].map(path=>({path,url:safeFile(path)})).filter(item=>item.url);const chooser=document.getElementById('chooser'),select=document.getElementById('document'),format=document.getElementById('format'),summary=document.getElementById('card-summary'),article=document.getElementById('article');
  const jsonText=text=>{const data=JSON.parse(text);if(Array.isArray(data.files)){const lines=['Sources processed: '+(data.sources_processed??data.files.length),'Sources found: '+(data.total_sources_found??data.files.length),''];data.files.forEach(file=>lines.push('• '+(file.source_file||file.source_path||'Document')+(file.chars_extracted?' · '+file.chars_extracted.toLocaleString()+' characters':'')));return lines.join('\n')}return [data.text,data.content,data.body].find(value=>typeof value==='string')||JSON.stringify(data,null,2)};
  const load=async item=>{select.value=item.path;const ext=item.path.split('.').pop().toLowerCase();format.textContent=ext==='md'?'markdown':ext;article.className='muted';article.textContent='Loading…';const response=await fetch(rawBytes(item.url));if(!response.ok)throw new Error(response.status);let text=await response.text();if(ext==='json')try{text=jsonText(text)}catch{}text=text.replace(/^<!--\s*source:\s*.*?-->\s*/i,'').trim();article.className='';article.textContent=text;const words=text?text.split(/\s+/).length:0;summary.replaceChildren(el('span',text||item.path),el('span',words+' word'+(words===1?'':'s'),'badge'))};
  files.forEach(item=>{const option=el('option',item.path);option.value=item.path;select.append(option)});if(files.length>1)chooser.hidden=false;select.addEventListener('change',()=>{const item=files.find(file=>file.path===select.value);if(item)load(item).catch(()=>{article.textContent='Unable to read this output.'})});
  const textFile=files.find(item=>item.path.split('/').pop()==='content.txt'),primary=files.find(item=>item.url.href===output.href)||files.find(item=>item.path.split('/').pop()===primaryName),initial=textFile||primary||files[0];if(initial)load(initial).catch(()=>{article.textContent='Unable to read extracted document.'});
})();
</script></body></html>
