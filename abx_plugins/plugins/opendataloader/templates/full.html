<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenDataLoader</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:#faf9f7;min-height:49px}h1{flex:none;font-size:15px;margin:0;white-space:nowrap}nav{display:flex;flex:none;gap:5px;margin-left:auto}nav a{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:5px 8px;text-decoration:none}nav a:hover{background:#f5f2ed}.chooser{display:flex;align-items:center;gap:6px;min-width:0;flex:1}.chooser[hidden]{display:none}.chooser label{color:var(--muted);flex:none}.chooser label span{display:none}.chooser select{min-width:0;max-width:100%;width:260px;padding:6px 24px 6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.format{color:var(--muted);font-size:10px;text-transform:uppercase}main{width:100%;min-width:0;margin:0}article{width:100%;max-width:76ch;margin:0 auto;padding:32px 24px;font:18px/1.68 Georgia,'Times New Roman',serif;white-space:pre-line;overflow-wrap:anywhere}.muted{color:var(--muted)}@media(max-width:800px){nav .label{display:none}.format{display:none}}@media(max-width:600px){header{gap:6px;padding:4px 8px;min-height:49px}h1{font-size:14px}header:has(.chooser:not([hidden])) .plugin-label{display:none}.chooser label{display:none}.chooser select{width:100%;min-height:36px}nav{gap:3px}nav a{width:40px;height:40px;padding:0}article{max-width:none;padding:20px 16px;font-size:18px;line-height:1.65}}
</style></head><body>
<header><h1 title="OpenDataLoader" aria-label="OpenDataLoader">▥ <span class="plugin-label">OpenDataLoader</span></h1><div id="chooser" class="chooser" hidden><label for="document">📄 <span>View</span></label><select id="document"></select><span id="format" class="format"></span></div><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main><article id="article"></article></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
  const rawPath='{{ output_path_raw|escapejs }}',plugin='{{ plugin|default:"opendataloader"|escapejs }}';
  const rawParts=rawPath.split('/').filter(Boolean),pluginIndex=rawParts.lastIndexOf(plugin),trailing=pluginIndex>=0?rawParts.length-pluginIndex-1:1;let pluginRoot=new URL('./',output);for(let i=1;i<trailing;i++)pluginRoot=new URL('../',pluginRoot);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=pluginRoot.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const knownFiles=[{% for file_path, file_info in result.output_files.items %}'{{ file_path|escapejs }}',{% endfor %}];
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeFile=value=>{if(typeof value!=='string'||!value||value.includes('..')||/^[a-z]+:/i.test(value))return null;let parts=value.split('/').filter(Boolean);if(parts[0]===plugin)parts=parts.slice(1);if(!parts.length)return null;return new URL(parts.map(encodeURIComponent).join('/'),pluginRoot)};
  const readable=knownFiles.filter(path=>/\.(txt|md|json)$/i.test(path)),primaryName=decodeURIComponent(output.pathname.split('/').pop()||'output');if(!readable.some(path=>path.split('/').pop()===primaryName))readable.unshift(primaryName);
  const files=[...new Set(readable)].map(path=>({path,url:safeFile(path)})).filter(item=>item.url);const chooser=document.getElementById('chooser'),select=document.getElementById('document'),format=document.getElementById('format'),article=document.getElementById('article');
  const jsonText=text=>{const data=JSON.parse(text);if(Array.isArray(data.files)){const lines=['Sources processed: '+(data.sources_processed??data.files.length),'Sources found: '+(data.total_sources_found??data.files.length),''];data.files.forEach(file=>lines.push('• '+(file.source_file||file.source_path||'Document')+(file.chars_extracted?' · '+file.chars_extracted.toLocaleString()+' characters':'')));return lines.join('\n')}return [data.text,data.content,data.body].find(value=>typeof value==='string')||JSON.stringify(data,null,2)};
  const load=async item=>{select.value=item.path;const ext=item.path.split('.').pop().toLowerCase();format.textContent=ext==='md'?'markdown':ext;article.className='muted';article.textContent='Loading…';const response=await fetch(rawBytes(item.url));if(!response.ok)throw new Error(response.status);let text=await response.text();if(ext==='json')try{text=jsonText(text)}catch{}text=text.replace(/^<!--\s*source:\s*.*?-->\s*/i,'').trim();article.className='';article.textContent=text;};
  files.forEach(item=>{const option=el('option',item.path);option.value=item.path;select.append(option)});if(files.length>1)chooser.hidden=false;select.addEventListener('change',()=>{const item=files.find(file=>file.path===select.value);if(item)load(item).catch(()=>{article.textContent='Unable to read this output.'})});
  const textFile=files.find(item=>item.path.split('/').pop()==='content.txt'),primary=files.find(item=>item.url.href===output.href)||files.find(item=>item.path.split('/').pop()===primaryName),initial=textFile||primary||files[0];if(initial)load(initial).catch(()=>{article.textContent='Unable to read extracted document.'});
})();
</script></body></html>
