<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 3fr;gap:8px 16px;margin:0}dt{color:var(--muted);overflow-wrap:anywhere}dd{margin:0;overflow-wrap:anywhere}details>summary{cursor:pointer}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:500px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}dl{grid-template-columns:1fr}dd{margin-bottom:6px}}

.social{overflow:hidden}.social img{display:block;width:calc(100% + 40px);margin:12px -20px 16px;max-height:280px;object-fit:cover}.social h2{font-size:22px;line-height:1.25;margin:12px 0}.social p{color:#526172}@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>🏷 SEO</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact = new URLSearchParams(location.search).get('card') === '1';
  document.body.classList.toggle('card-view', compact);
  const output = new URL('{{ output_path|escapejs }}', location.href);
  output.search = ''; output.hash = '';
  const folder = new URL('./', output);
  document.getElementById('files').href = folder.href + '?files=1';
  document.getElementById('download').href = output.href;
  document.getElementById('raw').href = output.href + '?preview=1&raw=1';
  const el = (tag, text, cls) => { const node = document.createElement(tag); if (text != null) node.textContent = String(text); if (cls) node.className = cls; return node; };
  const safeLink = (value, label) => { const a = el('a', label || value); try { const u = new URL(value); if (['https:', 'http:'].includes(u.protocol)) { a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; } } catch {} return a; };
  const summary = document.getElementById('card-summary');
  const content = document.getElementById('content');
  
  fetch(output).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    summary.append(el('span', data['og:title'] || data.title), el('span', data.language || data['og:locale'] || '', 'badge'));
    if (compact) return;
    const badges = el('div', null, 'badges');
    for (const [key, icon] of [['language','🌐'],['author','✍'],['robots','◉'],['theme-color','●']]) {
      if (!data[key]) continue;
      const badge = el('span', icon + ' ' + data[key], 'badge');
      if (key === 'theme-color' && CSS.supports('color', data[key])) badge.style.borderLeft = '12px solid ' + data[key];
      badges.append(badge);
    }
    content.append(badges);
    const cards = el('div', null, 'grid');
    for (const [prefix, label] of [['og:', 'Open Graph'],['twitter:', 'Twitter / X']]) {
      if (!Object.keys(data).some(k => k.startsWith(prefix))) continue;
      const card = el('article', null, 'panel social');
      card.append(el('div', label, 'muted'));
      // Use captured response files; never request the original image from the live site.
      const responseFiles = [{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'responses' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }}},{% endfor %}{% endif %}{% endfor %}];
      const imageURL = data[prefix+'image'] || (prefix === 'twitter:' ? data['og:image'] : '');
      if (imageURL) {
        try {
          const original = new URL(imageURL, data.url);
          if (['https:', 'http:'].includes(original.protocol)) {
            const img = el('img'); img.alt = data[prefix+'image:alt'] || ''; img.loading = 'lazy';
            const encoded = encodeURIComponent(original.href).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase()).replaceAll('%', '_');
            const match = responseFiles.find(file => file.path.includes('__GET__' + encoded));
            if (match) { img.src = new URL('../' + (match.root ? '' : 'responses/') + match.path.split('/').map(encodeURIComponent).join('/'), folder).href;
            img.addEventListener('error', () => img.remove(), {once:true}); card.append(img); }
          }
        } catch {}
      }
      card.append(el('h2', data[prefix+'title'] || data['og:title'] || data.title));
      if (data[prefix+'description'] || data.description) card.append(el('p', data[prefix+'description'] || data.description));
      const url = data[prefix+'url'] || data.canonical || data.url;
      if (url) card.append(safeLink(url, data['og:site_name'] || url));
      cards.append(card);
    }
    if (!cards.childElementCount) {
      const card=el('article',null,'panel'); card.append(el('h2',data.title));
      if(data.description) card.append(el('p',data.description));
      if(data.url) card.append(safeLink(data.url)); cards.append(card);
    }
    content.append(cards);
    const panel=el('section',null,'panel'); panel.append(el('h2','Metadata'));
    const fields=el('dl');
    for(const [key,value] of Object.entries(data)){ fields.append(el('dt',key),el('dd',value)); }
    panel.append(fields); content.append(panel);
  });

})();
</script></body></html>
