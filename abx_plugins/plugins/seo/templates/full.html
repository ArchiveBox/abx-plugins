<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1220px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 3fr;gap:8px 16px;margin:0}dt{color:var(--muted);overflow-wrap:anywhere}dd{margin:0;overflow-wrap:anywhere}details>summary{cursor:pointer}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}
.social{overflow:hidden;padding:0;border-radius:12px;color:#0f1419}.social-top{display:flex;align-items:center;gap:10px;padding:14px 16px 11px}.platform-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:#0f1419;color:#fff;font-weight:800;font-size:20px;letter-spacing:-1px}.identity{min-width:0;line-height:1.25}.identity strong,.identity span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.identity span{margin-top:3px;color:#536471;font-size:12px}.platform-name{margin-left:auto;align-self:flex-start;color:#64748b;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}.link-preview{display:block;margin:0 12px 12px;border:1px solid #cfd9de;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;background:#fff}.link-preview:hover{background:#f8fafc}.link-preview img{display:block;width:100%;aspect-ratio:1.91/1;max-height:230px;object-fit:cover;background:#eef2f5}.link-copy{padding:11px 13px 13px}.link-host{display:block;color:#536471;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link-copy h2{margin:3px 0 0;font-size:15px;line-height:1.35}.link-copy p{margin:4px 0 0;color:#536471;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.social-actions{display:flex;justify-content:space-around;border-top:1px solid #eff3f4;padding:9px 8px;color:#536471;font-size:12px;font-weight:600}.social-actions span{white-space:nowrap}.x-card{border-color:#cfd9de}.x-card .platform-mark{border-radius:8px}.facebook-card{border-color:#d8dadf;box-shadow:0 1px 2px rgba(0,0,0,.08);color:#050505}.facebook-card .platform-mark{background:#1877f2;font:800 27px/1 Arial,sans-serif}.facebook-card .link-preview{margin:0;border:0;border-radius:0;background:#f0f2f5}.facebook-card .link-copy{border-top:1px solid #dddfe2}.facebook-card .social-actions{margin:0 12px;border-color:#ced0d4;color:#65676b}.linkedin-card{border-color:#d6cec2;box-shadow:0 1px 2px rgba(0,0,0,.07);color:#191919}.linkedin-card .platform-mark{background:#0a66c2;border-radius:4px;font:800 17px/1 Arial,sans-serif;letter-spacing:-1px}.linkedin-card .link-preview{margin:0;border-width:1px 0;border-radius:0;background:#eef3f8}.linkedin-card .social-actions{color:#666}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){nav a{min-width:40px;min-height:40px}.label{display:none}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0;padding:12px}.grid{grid-template-columns:1fr}.panel{padding:14px}dl{grid-template-columns:1fr}dd{margin-bottom:6px}.social{padding:0}.link-preview img{max-height:none}.social-actions{font-size:11px}.platform-name{display:none}}
</style></head><body>
<header><h1>🏷 SEO</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact = new URLSearchParams(location.search).get('card') === '1';
  document.body.classList.toggle('card-view', compact);
  const output = new URL('{{ output_path|escapejs }}', location.href);
  output.search = ''; output.hash = '';
  const folder = new URL('./', output);
  document.getElementById('files').href = folder.href + '?files=1';
  document.getElementById('download').href = output.href;
  document.getElementById('raw').href = output.href + '?preview=1&raw=1';
  const el = (tag, text, cls) => { const node = document.createElement(tag); if (text != null) node.textContent = String(text); if (cls) node.className = cls; return node; };
  const safeLink = (value, label) => { const a = el('a', label || value); try { const u = new URL(value); if (['https:', 'http:'].includes(u.protocol)) { a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; } } catch {} return a; };
  const summary = document.getElementById('card-summary');
  const content = document.getElementById('content');
  
  fetch(output).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    summary.append(el('span', data['og:title'] || data.title), el('span', data.language || data['og:locale'] || '', 'badge'));
    if (compact) return;
    const badges = el('div', null, 'badges');
    for (const [key, icon] of [['language','🌐'],['author','✍'],['robots','◉'],['theme-color','●']]) {
      if (!data[key]) continue;
      const badge = el('span', icon + ' ' + data[key], 'badge');
      if (key === 'theme-color' && CSS.supports('color', data[key])) badge.style.borderLeft = '12px solid ' + data[key];
      badges.append(badge);
    }
    content.append(badges);
    const cards = el('div', null, 'grid');
    // Use captured response files; never request the original image from the live site.
    const responseFiles = [{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'responses' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }}},{% endfor %}{% endif %}{% endfor %}];
    const localImage = (imageURL, alt) => {
      if (!imageURL) return null;
      try {
        const original = new URL(imageURL, data.url);
        if (!['https:', 'http:'].includes(original.protocol)) return null;
        const encoded = encodeURIComponent(original.href).replace(/[!'()*]/g, char => '%' + char.charCodeAt(0).toString(16).toUpperCase()).replaceAll('%', '_');
        const match = responseFiles.find(file => file.path.includes('__GET__' + encoded));
        if (!match) return null;
        const img = el('img');
        img.alt = alt || '';
        img.loading = 'lazy';
        img.src = new URL('../' + (match.root ? '' : 'responses/') + match.path.split('/').map(encodeURIComponent).join('/'), folder).href;
        img.addEventListener('error', () => img.remove(), {once:true});
        return img;
      } catch { return null; }
    };
    const hostname = value => {
      try { return new URL(value, data.url).hostname.replace(/^www\./, ''); }
      catch { return value || ''; }
    };
    const addPreview = ({platform, mark, className, prefix, actions}) => {
      const rawURL = data[prefix+'url'] || data['og:url'] || data.canonical || data.url;
      let url = '';
      try { url = new URL(rawURL, data.url).href; } catch {}
      const title = data[prefix+'title'] || data['og:title'] || data.title;
      const description = data[prefix+'description'] || data['og:description'] || data.description;
      const imageURL = data[prefix+'image'] || data['og:image'];
      const author = data[prefix+'creator'] || data[prefix+'site'] || data.author || data['article:author'];
      const site = data['og:site_name'] || hostname(url);
      const card = el('article', null, 'panel social ' + className);
      const top = el('div', null, 'social-top');
      top.append(el('span', mark, 'platform-mark'));
      const identity = el('div', null, 'identity');
      identity.append(el('strong', author || site || title));
      if (author && site) identity.append(el('span', site));
      top.append(identity, el('span', platform, 'platform-name'));
      card.append(top);
      const preview = url ? safeLink(url, '') : el('div');
      preview.textContent = '';
      preview.className = 'link-preview';
      const image = localImage(imageURL, data[prefix+'image:alt'] || data['og:image:alt']);
      if (image) preview.append(image);
      const linkCopy = el('div', null, 'link-copy');
      if (url) linkCopy.append(el('span', hostname(url), 'link-host'));
      if (title) linkCopy.append(el('h2', title));
      if (description) linkCopy.append(el('p', description));
      preview.append(linkCopy);
      card.append(preview);
      const actionBar = el('div', null, 'social-actions');
      for (const action of actions) actionBar.append(el('span', action));
      card.append(actionBar);
      cards.append(card);
    };
    addPreview({platform:'X', mark:'𝕏', className:'x-card', prefix:'twitter:', actions:['♡ Like','↗ Reply','↻ Repost']});
    addPreview({platform:'Facebook', mark:'f', className:'facebook-card', prefix:'og:', actions:['♡ Like','◯ Comment','↗ Share']});
    addPreview({platform:'LinkedIn', mark:'in', className:'linkedin-card', prefix:'og:', actions:['♡ Like','◯ Comment','↻ Repost','➤ Send']});
    content.append(cards);
    const panel=el('section',null,'panel'); panel.append(el('h2','Metadata'));
    const fields=el('dl');
    for(const [key,value] of Object.entries(data)){ fields.append(el('dt',key),el('dd',value)); }
    panel.append(fields); content.append(panel);
  });

})();
</script></body></html>
