<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Google Docs exports</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202b36;
        --muted: #64748b;
        --line: #e2e6eb;
        --accent: #2563eb;
        --tint: #eff6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      body[data-kind="spreadsheets"] {
        --accent: #16805b;
        --tint: #edf9f3;
      }
      body[data-kind="presentation"] {
        --accent: #9b6908;
        --tint: #fff9e8;
      }
      body[data-kind="drawings"] {
        --accent: #a43e3e;
        --tint: #fff0f0;
      }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 20px;
        background: white;
        border-bottom: 1px solid var(--line);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--tint);
        color: var(--accent);
        font-size: 24px;
      }
      .heading {
        min-width: 0;
        flex: 1;
      }
      h1 {
        font-size: 17px;
        line-height: 1.3;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .subtitle {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      nav {
        display: flex;
        gap: 6px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--ink);
        padding: 7px 10px;
        text-decoration: none;
        white-space: nowrap;
      }
      nav a:hover {
        background: #f1f5f9;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 16px;
        padding: 20px;
        max-width: 1600px;
        margin: auto;
      }
      aside h2 {
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .formats {
        display: grid;
        gap: 8px;
      }
      .format {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        font: inherit;
      }
      .format:hover {
        border-color: #94a3b8;
      }
      .format[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--tint);
        box-shadow: inset 3px 0 var(--accent);
      }
      .filetype {
        display: grid;
        place-items: center;
        min-width: 40px;
        height: 44px;
        background: #f1f5f9;
        border-radius: 5px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
      }
      .format[aria-pressed="true"] .filetype {
        background: white;
      }
      .name {
        font-size: 13px;
        font-weight: 600;
      }
      .size {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .panel {
        min-width: 0;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .panel-head h2 {
        font-size: 14px;
        margin: 0;
      }
      .panel-head a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
      }
      .note {
        margin: 0;
        padding: 8px 16px;
        background: #f8fafc;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      #preview {
        height: calc(100vh - 215px);
        min-height: 400px;
        overflow: auto;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #eef0f3;
      }
      .image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
        object-fit: contain;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: 24px;
        font: 13px/1.7 ui-monospace, SFMono-Regular, monospace;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      td,
      th {
        padding: 8px 12px;
        border: 1px solid #e5e9ed;
        text-align: left;
        white-space: pre-wrap;
        max-width: 400px;
        overflow-wrap: anywhere;
      }
      th {
        background: #f1f5f9;
        position: sticky;
        top: 0;
        font-weight: 600;
      }
      tbody tr:nth-child(even) {
        background: #fafbfc;
      }
      .empty {
        padding: 64px 24px;
        text-align: center;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 16px;
        margin-bottom: 8px;
      }
      #errors {
        color: #a43e3e;
        font-size: 12px;
        white-space: pre-wrap;
        margin: 12px 0;
      }
      .loading {
        padding: 24px;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 700px) {
        header {
          padding: 12px;
        }
        nav .label {
          display: none;
        }
        nav a {
          min-height: 40px;
          min-width: 40px;
          justify-content: center;
        }
        main {
          grid-template-columns: 1fr;
          padding: 12px;
          gap: 12px;
        }
        .formats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .format {
          padding: 9px;
          gap: 8px;
        }
        aside h2 {
          margin-bottom: 8px;
        }
        .filetype {
          height: 36px;
          min-width: 36px;
        }
        .mark {
          width: 32px;
          height: 38px;
        }
        h1 {
          font-size: 15px;
        }
        #preview {
          height: 65vh;
          min-height: 320px;
        }
        .panel-head {
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body data-output="{{ output_path }}">
    <header>
      <span class="mark" aria-hidden="true">▤</span>
      <div class="heading">
        <h1 id="title">Google Docs exports</h1>
        <p class="subtitle" id="summary">Saved document formats</p>
      </div>
      <nav aria-label="Output actions">
        <a id="files" title="View all files" aria-label="View all files"
          >📁<span class="label">View all files</span></a
        ><a
          id="raw"
          title="View export manifest"
          aria-label="View export manifest"
          >&lt;/&gt;<span class="label">View raw</span></a
        >
      </nav>
    </header>
    <main>
      <aside>
        <h2>Available formats</h2>
        <div class="formats" id="formats"></div>
        <p id="errors" role="status"></p>
      </aside>
      <section class="panel" aria-label="Document preview">
        <div class="panel-head">
          <h2 id="preview-title">Preview</h2>
          <a id="download" download hidden>⤓ Download</a>
        </div>
        <p class="note" id="note" hidden></p>
        <div id="preview" aria-live="polite">
          <p class="loading">Loading exports…</p>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const byId = (id) => document.getElementById(id),
          el = (tag, text, cls) => {
            const node = document.createElement(tag);
            if (text != null) node.textContent = text;
            if (cls) node.className = cls;
            return node;
          };
        const output = new URL(document.body.dataset.output, document.baseURI);
        output.search = "";
        output.hash = "";
        const raw = (url) => {
          const result = new URL(url);
          result.searchParams.set("raw", "1");
          return result.href;
        };
        byId("files").href = new URL("./?files=1", output).href;
        byId("raw").href = raw(output);
        const labels = {
          docx: "Word document",
          xlsx: "Excel workbook",
          pptx: "PowerPoint",
          pdf: "PDF document",
          csv: "CSV spreadsheet",
          tsv: "TSV spreadsheet",
          odt: "OpenDocument text",
          ods: "OpenDocument sheet",
          odp: "OpenDocument slides",
          txt: "Plain text",
          md: "Markdown",
          rtf: "Rich text",
          zip: "HTML & assets",
          epub: "EPUB ebook",
          svg: "Vector drawing",
          png: "PNG image",
          jpg: "JPEG image",
        };
        const sizeLabel = (size) =>
          size >= 1048576
            ? (size / 1048576).toFixed(1) + " MB"
            : size >= 1024
            ? Math.ceil(size / 1024) + " KB"
            : size + " B";
        let exports = [],
          selection = 0;
        async function readText(url) {
          const response = await fetch(raw(url));
          if (!response.ok) throw Error("Preview unavailable");
          const reader = response.body.getReader(),
            decoder = new TextDecoder();
          let text = "",
            bytes = 0;
          try {
            while (bytes < 262144) {
              const { done, value } = await reader.read();
              if (done)
                return { text: text + decoder.decode(), truncated: false };
              const part = value.subarray(0, 262144 - bytes);
              bytes += part.length;
              text += decoder.decode(part, { stream: true });
            }
            return { text, truncated: true };
          } finally {
            await reader.cancel();
          }
        }
        function csvRows(text, delimiter) {
          const rows = [];
          let row = [],
            cell = "",
            quoted = false;
          for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (c === '"') {
              if (quoted && text[i + 1] === '"') {
                cell += '"';
                i++;
              } else quoted = !quoted;
            } else if (c === delimiter && !quoted) {
              row.push(cell);
              cell = "";
            } else if ((c === "\n" || c === "\r") && !quoted) {
              if (c === "\r" && text[i + 1] === "\n") i++;
              row.push(cell);
              rows.push(row);
              row = [];
              cell = "";
              if (rows.length >= 201) break;
            } else cell += c;
          }
          if (rows.length < 201 && (cell || row.length))
            rows.push([...row, cell]);
          return rows;
        }
        async function select(item) {
          const generation = ++selection,
            preview = byId("preview"),
            note = byId("note");
          preview.replaceChildren();
          note.hidden = true;
          for (const button of byId("formats").children)
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.format === item.format)
            );
          byId("preview-title").textContent = labels[item.format];
          const url = new URL(item.path, output),
            download = byId("download");
          download.href = raw(url);
          download.download = item.path;
          download.hidden = false;
          download.textContent = "⤓ Download " + item.format.toUpperCase();
          const pdf = exports.find((file) => file.format === "pdf");
          if (
            item.format === "pdf" ||
            (!["csv", "tsv", "txt", "md", "svg", "png", "jpg"].includes(
              item.format
            ) &&
              pdf)
          ) {
            const frame = el("iframe");
            frame.title = "Archived document PDF";
            frame.src = raw(new URL(pdf.path, output)) + "#view=FitH";
            preview.append(frame);
            if (item.format !== "pdf") {
              note.textContent =
                "PDF preview · Download " +
                item.format.toUpperCase() +
                " for the original export.";
              note.hidden = false;
            }
            return;
          }
          if (["svg", "png", "jpg"].includes(item.format)) {
            const image = el("img", null, "image");
            image.alt = "Archived drawing";
            image.src = raw(url);
            preview.append(image);
            return;
          }
          if (!["csv", "tsv", "txt", "md"].includes(item.format)) {
            const empty = el("div", null, "empty");
            empty.append(
              el("strong", labels[item.format]),
              el(
                "span",
                "Download this export to open it in a compatible application."
              )
            );
            preview.append(empty);
            return;
          }
          try {
            const { text, truncated } = await readText(url);
            if (generation !== selection) return;
            if (["csv", "tsv"].includes(item.format)) {
              const rows = csvRows(text, item.format === "csv" ? "," : "\t"),
                table = el("table"),
                head = el("thead"),
                body = el("tbody");
              rows.forEach((row, index) => {
                const tr = el("tr");
                for (const cell of row.slice(0, 30))
                  tr.append(el(index === 0 ? "th" : "td", cell));
                (index === 0 ? head : body).append(tr);
              });
              table.append(head, body);
              preview.append(table);
              note.textContent =
                "Single-sheet export" +
                (rows.length >= 201 || truncated
                  ? " · Showing the first 200 rows"
                  : "") +
                (rows.some((row) => row.length > 30)
                  ? " · First 30 columns"
                  : "");
              note.hidden = false;
            } else {
              preview.append(el("pre", text));
              if (truncated) {
                note.textContent =
                  "Preview truncated · Download the complete file above.";
                note.hidden = false;
              }
            }
          } catch (error) {
            if (generation === selection)
              preview.append(el("p", error.message, "empty"));
          }
        }
        fetch(raw(output))
          .then((response) => {
            if (!response.ok) throw Error("Export manifest unavailable");
            return response.json();
          })
          .then((manifest) => {
            document.body.dataset.kind = manifest.document_type;
            byId("title").textContent = manifest.title || "Google Docs exports";
            exports = (manifest.exports || []).filter(
              (item) =>
                Object.hasOwn(labels, item.format) &&
                item.path === "document." + item.format
            );
            byId("summary").textContent =
              exports.length +
              " formats · " +
              sizeLabel(
                exports.reduce((sum, item) => sum + (Number(item.size) || 0), 0)
              );
            byId("errors").textContent = (manifest.errors || [])
              .map((item) => item.format.toUpperCase() + ": " + item.error)
              .join("\n");
            for (const item of exports) {
              const button = el("button", null, "format");
              button.type = "button";
              button.dataset.format = item.format;
              button.setAttribute("aria-pressed", "false");
              button.append(el("span", item.format.toUpperCase(), "filetype"));
              const details = el("span", labels[item.format], "name");
              details.append(el("span", sizeLabel(item.size), "size"));
              button.append(details);
              button.addEventListener("click", () => select(item));
              byId("formats").append(button);
            }
            const initial =
              exports.find((item) => item.format === "pdf") || exports[0];
            if (initial) select(initial);
            else
              byId("preview").replaceChildren(
                el("p", "No exports saved", "empty")
              );
          })
          .catch((error) =>
            byId("preview").replaceChildren(el("p", error.message, "empty"))
          );
      })();
    </script>
  </body>
</html>
