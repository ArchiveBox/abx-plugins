<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archived repository</title>
<style>
:root{color-scheme:light;--line:#d1d9e0;--muted:#59636e;--blue:#0969da}*{box-sizing:border-box}body{margin:0;color:#1f2328;background:white;font:14px/1.5 system-ui,-apple-system,sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{background:#f6f8fa;border-bottom:1px solid var(--line);padding:20px 28px}.heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;font-weight:600;margin:0;overflow-wrap:anywhere}.badge{border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted);font-size:12px}.actions{margin-left:auto;display:flex;gap:8px}.button,button{border:1px solid var(--line);border-radius:6px;padding:5px 12px;color:#1f2328;background:#f6f8fa;font:inherit;cursor:pointer}main{max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--muted)}#breadcrumb{overflow-wrap:anywhere}.tree,.readme{border:1px solid var(--line);border-radius:6px;overflow:hidden}.tree-head,.readme-head{background:#f6f8fa;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}.row{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #d1d9e080}.row:last-child{border:0}.row:hover{background:#f6f8fa}.row a{color:#1f2328;overflow-wrap:anywhere}.size{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.readme{margin-top:18px}iframe{display:block;width:100%;height:650px;border:0;background:white}h2{margin:0 0 12px;font-size:16px}#description{overflow-wrap:anywhere}#topics{display:flex;flex-wrap:wrap;gap:6px}.topic{background:#ddf4ff;color:#0969da;border-radius:20px;padding:2px 10px;font-size:12px}#stars{margin-top:16px;color:var(--muted)}.note{color:var(--muted);font-size:12px;margin-top:18px}.empty{padding:24px;color:var(--muted)}.compact header{padding:8px 12px}.compact h1{font-size:13px}.compact .actions,.compact .badge,.compact .readme,.compact .toolbar,.compact .note{display:none}.compact main{padding:8px 12px;display:block}.compact aside{font-size:11px}.compact aside h2,.compact .tree{display:none}.compact #description{margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.compact #stars{margin:4px 0}.compact .topic{font-size:10px}.compact{overflow:hidden}@media(max-width:700px){main{display:flex;flex-direction:column;padding:16px;gap:20px}aside{order:-1}header{padding:16px}.actions{margin-left:0}iframe{height:520px}}
</style></head><body>
<header><div class="heading"><h1 id="name">Git repository</h1><span class="badge">Archived</span><div class="actions"><a id="source" class="button" target="_blank" rel="noopener noreferrer" hidden>Original ↗</a><a id="files" class="button">Browse files</a></div></div></header>
<main><section><div class="toolbar"><span>▣</span><span id="breadcrumb">Repository files</span></div><div class="tree"><div class="tree-head">Captured code <span id="count" class="badge"></span></div><div id="entries"></div></div><section class="readme" id="readme" hidden><div class="readme-head"><a id="readme-link">README</a></div></section></section><aside><h2>About</h2><p id="description">Archived Git repository</p><div id="topics"></div><div id="stars" hidden></div><p class="note">Files and metadata from this snapshot. Counts reflect the captured page.</p></aside></main>
<script>
(()=>{
 const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('compact',compact);
 const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
 const root=new URL(output);const boundary=root.pathname.search(/\/git(?:\/|$)/);root.pathname=boundary>=0?root.pathname.slice(0,boundary+1):new URL('../',output).pathname;
 const folder=new URL('git/',root),byId=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
 const captures=[{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'git' or capture.plugin == 'dom' or capture.plugin == 'wget' or capture.plugin == 'singlefile' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',plugin:'{{ capture.plugin|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }},size:{{ info.size|default:0 }}},{% endfor %}{% endif %}{% endfor %}];
 const relative=file=>file.root?file.path:file.plugin+'/'+file.path;
 const valid=path=>!path.startsWith('/')&&!path.split('/').some(part=>part==='..'||part==='.'||part==='');
 const fileURL=path=>new URL(path.split('/').map(encodeURIComponent).join('/'),root);
 const files=[...new Map(captures.filter(f=>f.plugin==='git').map(f=>({...f,path:relative(f).replace(/^git\//,'')})).filter(f=>valid(f.path)&&!f.path.split('/').includes('.git')&&!/^on_Snapshot__|^git\.jsonl$/.test(f.path)).map(f=>[f.path,f])).values()];
 byId('files').href=folder.href+'?files=1';byId('count').textContent=files.length+' files';if(compact)byId('description').textContent=files.length+' captured files';
 const source='{{ snapshot.url|escapejs }}';try{const url=new URL(source);if(['http:','https:'].includes(url.protocol)){byId('source').href=url.href;byId('source').hidden=false;const parts=url.pathname.split('/').filter(Boolean);byId('name').textContent=parts.slice(0,2).join(' / ').replace(/\.git$/,'')||url.hostname}}catch{}
 document.title=byId('name').textContent+' · Archived repository';
 const browse=prefix=>{byId('breadcrumb').textContent=prefix||'Repository files';const entries=byId('entries');entries.replaceChildren();const items=new Map();for(const f of files){if(!f.path.startsWith(prefix))continue;const tail=f.path.slice(prefix.length),name=tail.split('/')[0],directory=tail.includes('/');if(!items.has(name)||directory)items.set(name,{name,directory,size:f.size})}const row=(name,directory,path,size)=>{const wrap=el('div',null,'row'),a=el('a',name);a.href=fileURL('git/'+path).href+(directory?'?files=1':'');if(directory)a.addEventListener('click',event=>{if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();browse(path)});wrap.append(el('span',directory?'▸':'▤'),a);if(!directory)wrap.append(el('span',Number(size).toLocaleString()+' B','size'));entries.append(wrap)};if(prefix)row('..',true,prefix.split('/').slice(0,-2).join('/')+(prefix.split('/').length>2?'/':''));for(const item of [...items.values()].sort((a,b)=>Number(b.directory)-Number(a.directory)||a.name.localeCompare(b.name)))row(item.name,item.directory,prefix+item.name+(item.directory?'/':''),item.size);if(!items.size)entries.append(el('p','No file inventory available. Use Browse files to explore this capture.','empty'))};
 if(!compact){browse('');const readme=files.filter(f=>/^(readme(?:\.(md|markdown|rst|txt))?)$/i.test(f.path)).sort((a,b)=>Number(!/\.md$/i.test(a.path))-Number(!/\.md$/i.test(b.path)))[0];if(readme){const url=fileURL('git/'+readme.path);byId('readme').hidden=false;byId('readme-link').textContent=readme.path;byId('readme-link').href=url.href;const frame=el('iframe');frame.title=readme.path;frame.loading='lazy';frame.setAttribute('sandbox','');frame.src=/\.(md|markdown)$/i.test(readme.path)?url.href:url.href+'?preview=1&raw=1';byId('readme').append(frame)}}
 // Parse one already-captured page inertly; never run its scripts or load its assets.
 const page=['dom','wget','singlefile'].map(plugin=>captures.find(f=>f.plugin===plugin&&/\.html?$/i.test(f.path)&&valid(relative(f)))).find(Boolean);
 if(page){const url=fileURL(relative(page));url.searchParams.set('raw','1');fetch(url).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(text=>{const doc=new DOMParser().parseFromString(text,'text/html');const description=doc.querySelector('.f4.my-3')?.textContent.trim()||doc.querySelector('meta[name="description"]')?.content||doc.querySelector('meta[property="og:description"]')?.content;if(description)byId('description').textContent=description;const star=doc.querySelector('#repo-stars-counter-star, [href$="/stargazers"] .Counter, [href$="/stargazers"] strong');if(star){byId('stars').textContent='☆ '+(star.getAttribute('title')||star.textContent).trim()+' stars';byId('stars').hidden=false}const topics=new Set([...doc.querySelectorAll('a.topic-tag, a[data-octo-click="topic_click"]')].map(n=>n.textContent.trim()).filter(Boolean));for(const topic of [...topics].slice(0,20))byId('topics').append(el('span',topic,'topic'))}).catch(()=>{})}
})();
</script></body></html>
