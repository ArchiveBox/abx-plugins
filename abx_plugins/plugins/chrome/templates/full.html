<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 3fr;gap:8px 16px;margin:0}dt{color:var(--muted);overflow-wrap:anywhere}dd{margin:0;overflow-wrap:anywhere}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}.browser{overflow:hidden;padding:0;border-color:#b7c1cc;box-shadow:0 12px 30px #1e293b17}.chrome-top{background:#dfe3e8;border-bottom:1px solid #c5cbd2}.tabs{height:42px;display:flex;align-items:flex-end;padding:0 14px;gap:12px}.lights{display:flex;gap:6px;padding-bottom:14px}.light{width:11px;height:11px;border-radius:50%}.tab{height:34px;min-width:230px;max-width:440px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff;border-radius:9px 9px 0 0}.tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;align-items:center;gap:9px;padding:8px 14px;background:#fff}.omnibox{min-width:0;flex:1;border-radius:18px;background:#f1f3f4;padding:6px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.viewport{padding:28px;background:linear-gradient(135deg,#f8fbff,#fff);min-height:250px}.diagram{display:flex;align-items:stretch;justify-content:center;gap:10px}.node{flex:1;min-width:0;max-width:250px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px}.node-icon{font-size:25px}.node strong{display:block;margin:5px 0}.node code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edge{display:grid;place-items:center;color:#8aa0b5}.status-good{color:#16803b}.extensions{display:grid;gap:8px}.extension{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px}.extension strong,.extension code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:640px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.browser{padding:0}.tab{min-width:140px}.diagram{flex-direction:column}.edge{transform:rotate(90deg)}dl{grid-template-columns:1fr}dd{margin-bottom:6px}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}

.hook-history{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.hook-row{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.hook-row>strong{font:12px/1.5 ui-monospace,monospace;margin-right:10px}.hook-row dl{margin-top:10px;font-size:12px}.browser .viewport{padding:18px}.diagram{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1.3fr);align-items:start}.node{max-width:none;width:100%}.node code{white-space:normal;overflow-wrap:anywhere}.node dl{display:block;margin-top:14px}.node dt{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}.node dd{font:12px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.navigation-flow{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.navigation-flow .route{padding:10px;background:#f1f5f9;border-radius:6px;overflow-wrap:anywhere}.navigation-flow .route-label{font-size:10px;text-transform:uppercase;color:var(--muted)}.navigation-flow .route-edge{padding:8px 12px;color:var(--accent)}.session-heading{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.session-heading strong{margin:0}.session-heading .node-icon{font-size:20px}.browser-caption{padding:8px 14px;background:#edf0f3;border-bottom:1px solid var(--line);font:11px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.capture-time{font-size:11px;color:var(--muted);margin-top:12px}.omnibox{white-space:normal;overflow-wrap:anywhere}.tab{min-width:0;flex:1}.tabs{min-width:0}.edge{align-self:center}@media(max-width:640px){.diagram{grid-template-columns:minmax(0,1fr)}.browser .viewport{padding:12px}.edge{transform:none;justify-self:center}.edge::first-letter{font-size:0}.edge{font-size:0}.edge:after{content:'↓';font-size:18px}.node{padding:12px}.toolbar{padding:8px}.extension{grid-template-columns:auto minmax(0,1fr)}.extension>.badge{grid-column:2;white-space:normal;overflow-wrap:anywhere}}
</style></head><body>
<header><h1>🖥 Chrome</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('card-view',compact);
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};const summary=document.getElementById('card-summary'),content=document.getElementById('content');
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  const get=async(name,json=false)=>{try{const url=new URL(name,folder);url.searchParams.set('raw','1');const r=await fetch(url);if(!r.ok)return null;return json?r.json():r.text()}catch{return null}};
  const short=value=>{const s=String(value||'').trim();return s.length>24?`${s.slice(0,12)}…${s.slice(-8)}`:s};
  Promise.all([get('navigation.json',true),get('browser.json',true),get('target_id.txt'),get('cdp_url.txt'),get('chrome.pid'),get('url.txt'),get('../index.jsonl')]).then(([nav,browser,target,endpoint,pid,savedURL,index])=>{
    target=target?.trim();endpoint=endpoint?.trim();pid=pid?.trim();const records=(index||'').split('\n').flatMap(line=>{try{return [JSON.parse(line)]}catch{return []}});
    const binaries=records.filter(record=>record.type==='Binary'&&/chrom(e|ium)/i.test(record.name||''));
    const results=records.filter(record=>record.type==='ArchiveResult'&&record.plugin==='chrome');
    const processes=records.filter(record=>record.type==='Process'&&(record.plugin==='chrome'||(record.cmd||[]).some(part=>/[/]chrome[/]on_/.test(part))));
    if(!target)for(const result of results){const match=(result.output_str||'').match(/(?:^|\s)target=([^\s]+)/);if(match)target=match[1]}
    const requested=nav?.url||savedURL?.trim()||'',finalURL=nav?.finalUrl||requested;let host='Chrome tab';try{host=new URL(finalURL).hostname||host}catch{}
    const status=nav?.status;summary.append(el('span',`🖥 ${host}${status?' · HTTP '+status:''}${nav?.elapsed!=null?' · '+nav.elapsed+'ms':''}`));if(compact)return;
    const shell=el('section',null,'panel browser'),top=el('div',null,'chrome-top'),tabs=el('div',null,'tabs'),lights=el('div',null,'lights');[['#ff5f57'],['#febc2e'],['#28c840']].forEach(([color])=>{const dot=el('span',null,'light');dot.style.background=color;lights.append(dot)});const tab=el('div',null,'tab');tab.append(el('span','🌐'),el('span',host,'tab-title'),el('span','×','muted'));tabs.append(lights,tab);top.append(tabs);
    const toolbar=el('div',null,'toolbar');toolbar.append(el('span','‹','muted'),el('span','›','muted'),el('span','↻','muted'));const omni=el('div',null,'omnibox');omni.append(el('span',finalURL?.startsWith('https:')?'🔒 ':'◯ '),el('span',finalURL||requested||'about:blank'));toolbar.append(omni,el('span','⋮','muted'));top.append(toolbar);shell.append(top);
    const viewport=el('div',null,'viewport'),diagram=el('div',null,'diagram');
    const makeNode=(icon,title)=>{const node=el('div',null,'node'),heading=el('div',null,'session-heading');heading.append(el('span',icon,'node-icon'),el('strong',title));node.append(heading);return node};
    const fields=(node,rows)=>{const dl=el('dl');for(const [label,value] of rows){if(value!==null&&value!==undefined&&value!=='')dl.append(el('dt',label),el('dd',typeof value==='object'?JSON.stringify(value,null,2):value))}if(dl.childElementCount)node.append(dl)};
    const browserNode=makeNode('🖥','Browser');
    if(typeof browser?.ready==='boolean'){const status=el('span',browser.ready?'●':'○',browser.ready?'status-good':'muted');status.title=browser.ready?'Ready at capture':'Not ready at capture';status.setAttribute('role','img');status.setAttribute('aria-label',status.title);browserNode.querySelector('.session-heading').append(status)}
    fields(browserNode,[['PID',pid],['CDP endpoint',endpoint]]);
    for(const binary of binaries)fields(browserNode,[['Binary',[binary.name,binary.version].filter(Boolean).join(' · ')],['Executable',binary.abspath],['Provider',binary.binprovider],['Binary ID',binary.id],['SHA-256',binary.sha256]]);
    fields(browserNode,Object.entries(browser||{}).filter(([key])=>!['extensions','ready'].includes(key)));
    const tabNode=makeNode('▱',host);fields(tabNode,[['Target ID',target]]);
    const flow=el('div',null,'navigation-flow');
    const route=(label,url)=>{const box=el('div',null,'route');box.append(el('div',label,'route-label'),safeLink(url));return box};
    if(requested)flow.append(route('Requested',requested));
    const conditions=[status!=null?'HTTP '+status:null,nav?.elapsed!=null?nav.elapsed+' ms':null,nav?.waitUntil].filter(Boolean);if(conditions.length)flow.append(el('div','↓ '+conditions.join(' · '),'route-edge'));
    if(finalURL)flow.append(route('Final',finalURL));
    if(nav?.timestamp)flow.append(el('div',nav.timestamp,'capture-time'));
    fields(flow,Object.entries(nav||{}).filter(([key])=>!['url','finalUrl','status','elapsed','waitUntil','timestamp'].includes(key)));
    tabNode.append(flow);diagram.append(browserNode,el('span','→','edge'),tabNode);viewport.append(diagram);shell.append(viewport);content.append(shell);
    if(results.length){const lifecycle=el('div',null,'hook-history');lifecycle.append(el('h2','Capture hooks'));for(const result of results){const item=el('div',null,'hook-row'),process=processes.find(p=>p.id===result.process_id||p.hook_name&&p.hook_name===result.hook_name||(p.cmd||[]).some(arg=>arg.endsWith('/'+result.hook_name+'.js')));item.append(el('strong',result.hook_name),el('span',result.status,'badge'));fields(item,[['Result',result.output_str],['Result ID',result.id],['Process ID',process?.id],['Hook PID',process?.pid],['Started',process?.started_at],['Ended',process?.ended_at],['Exit code',process?.exit_code],['Working directory',process?.pwd]]);lifecycle.append(item)}viewport.append(lifecycle)}
    const extensions=Array.isArray(browser?.extensions)?browser.extensions:[];if(extensions.length){const panel=el('section',null,'panel');panel.append(el('h2',`Extensions · ${extensions.length}`));const list=el('div',null,'extensions');extensions.forEach((extension,index)=>{const row=el('div',null,'extension');row.append(el('span','🧩'),el('span',null));const body=row.children[1],name=extension.name||extension.id||`Extension ${index+1}`;body.append(extension.webstore_url?safeLink(extension.webstore_url,name):el('strong',name));const extensionPath=extension.unpacked_path||extension.crx_path||extension.path;if(extensionPath)body.append(el('code',extensionPath));const metadata=[extension.version&&`v${extension.version}`,extension.manifest_version&&`MV${extension.manifest_version}`,short(extension.id)].filter(Boolean).join(' · ');row.append(el('span',metadata,'badge'));list.append(row)});panel.append(list);content.append(panel)}
  });
})();
</script></body></html>
