{% extends 'plugins/config_editor.html' %}
{% block label %}Prepare the page{% endblock %}
{% block language %}JavaScript · async{% endblock %}
{% block snippets %}
<button type="button" data-config-insert="{
  const host = await page.evaluate({expression: &#x27;location.hostname&#x27;});
  const domain = &#x27;example.com&#x27;;
  if (host !== domain &amp;&amp; !host.endsWith(&#x27;.&#x27; + domain)) {
    return {status: &#x27;skipped&#x27;, reason: &#x27;Domain not selected: &#x27; + host};
  }
}
" data-config-position="start">+ Domain guard</button>
<button type="button" data-config-wrap="const host = await page.evaluate({expression: &#x27;location.hostname&#x27;});
const onDomain = domain =&gt; host === domain || host.endsWith(&#x27;.&#x27; + domain);
if (onDomain(&#x27;example.com&#x27;)) {
__SCRIPT__
} else if (onDomain(&#x27;example.org&#x27;)) {
  // Add steps for your second domain here.
} else {
  return {status: &#x27;skipped&#x27;, reason: &#x27;Domain not selected: &#x27; + host};
}
">+ Route by domain</button>
<button type="button" data-config-insert="const host = await page.evaluate({expression: &#x27;location.hostname&#x27;});
const onDomain = domain =&gt; host === domain || host.endsWith(&#x27;.&#x27; + domain);
if (onDomain(&#x27;example.com&#x27;)) {
  return {prompt: __VALUE__};
}
if (onDomain(&#x27;example.org&#x27;)) {
  return {prompt: &#x27;Expand the main content and prepare the page for capture.&#x27;};
}
return {status: &#x27;skipped&#x27;, reason: &#x27;Domain not selected: &#x27; + host};
" data-config-source="STAGEHAND_PROMPT" data-config-source-default="Prepare the main content for capture.">+ Domain prompts</button>
<button type="button" data-config-insert="await page.evaluate({expression: &quot;document.querySelectorAll(&#x27;details&#x27;).forEach(el =&gt; el.open = true)&quot;});">+ Expand details</button>
<button type="button" data-config-insert="await page.evaluate({expression: &quot;window.scrollTo(0, document.body.scrollHeight)&quot;});">+ Scroll to end</button>
{% endblock %}
{% block help %}Run before capture with browser, page, config, client, and outputDir.{% endblock %}
