<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML to Text</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff;--bg:#f5f3ef}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}nav{display:flex;gap:6px;margin-left:auto}nav a{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:6px 9px;text-decoration:none}nav a:hover{background:#f5f2ed}main{width:min(72rem,calc(100% - 32px));margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(48,42,34,.05)}article{max-width:72ch;margin:0 auto;padding:clamp(28px,6vw,72px);font:18px/1.68 Georgia,'Times New Roman',serif;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted)}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;border:1px solid #e2e6eb;border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:500px){header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px}h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav{margin:0;flex:none}nav a{width:32px;height:32px;padding:0}.label{display:none}main{width:100%;margin:0;border:0;border-radius:0;box-shadow:none}article{padding:24px 20px;font-size:17px;line-height:1.65}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>☰ HTML to Text</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main><article id="article"></article></main>
<script>
(() => {
  const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('card-view',compact);
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const summary=document.getElementById('card-summary'),article=document.getElementById('article');
  fetch(rawBytes(output)).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(text=>{const clean=text.trim(),words=clean?clean.split(/\s+/).length:0;article.textContent=clean;summary.append(el('span',clean||'Extracted text'),el('span',words+' word'+(words===1?'':'s'),'badge'))}).catch(()=>{article.textContent='Unable to read extracted text.';article.className='muted'});
})();
</script></body></html>
