{% extends 'plugins/config_editor.html' %}
{% block label %}Prepare the page{% endblock %}
{% block language %}Python{% endblock %}
{% block snippets %}
<button type="button" data-config-insert="import sys

host = js(&#x27;location.hostname&#x27;)
domain = &#x27;example.com&#x27;
if host != domain and not host.endswith(&#x27;.&#x27; + domain):
    print(&#x27;Domain not selected: &#x27; + host)
    sys.exit(10)
" data-config-position="start">+ Domain guard</button>
<button type="button" data-config-insert="js(&quot;document.querySelectorAll(&#x27;details&#x27;).forEach(el =&gt; el.open = true)&quot;)">+ Expand details</button>
<button type="button" data-config-insert="js(&quot;window.scrollTo(0, document.body.scrollHeight)&quot;)">+ Scroll to end</button>
{% endblock %}
{% block help %}Run before capture with browser-harness helpers such as js().{% endblock %}
