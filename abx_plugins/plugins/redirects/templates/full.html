<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirects</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8;--http:#326da8;--js:#8b5aa7;--meta:#a56818}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}nav{display:flex;gap:6px;margin-left:auto}nav a{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none}nav a:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:920px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}.overview{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}.overview strong{font-size:17px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.overview .badge:first-of-type{margin-left:auto}.chain{max-width:800px;margin:0 auto}.node{position:relative;border:1px solid var(--line);border-left:5px solid #64748b;border-radius:9px;background:#fff;padding:13px 16px}.node.start{border-left-color:#16805b}.node.end{border-left-color:#8b5aa7}.node-label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.node a,.node .url{display:block;font:13px/1.45 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.edge{min-height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.edge::before,.edge::after{content:'';height:1px;background:var(--line)}.edge-info{min-width:150px;text-align:center;padding:5px 10px}.edge-arrow{font-size:19px;line-height:1;color:#94a3b8}.cause{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}.cause.http{color:var(--http)}.cause.javascript{color:var(--js)}.cause.meta_refresh{color:var(--meta)}.detail{display:block;color:var(--muted);font:11px/1.4 ui-monospace,SFMono-Regular,monospace;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.transition{margin-bottom:18px}.transition:last-child{margin-bottom:0}.muted{color:var(--muted)}#card-summary{display:none}.card-view{background:#f8fafc;overflow:hidden}.card-view header,.card-view main{display:none}.card-view #card-summary{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:11px;color:#475569}.card-view #card-summary span{overflow:hidden;text-overflow:ellipsis}.card-view .badge{padding:0 4px;font-size:10px;flex:none}@media(max-width:540px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.overview .badge:first-of-type{margin-left:0}.edge{grid-template-columns:1fr}.edge::before,.edge::after{display:none}.edge-info{padding:8px}.detail{max-width:240px;margin:auto}}
</style></head><body>
<header><h1>↪ Redirect Chain</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<div id="card-summary"></div><main id="content"></main>
<script>
(() => {
  const compact=new URLSearchParams(location.search).get('card')==='1';document.body.classList.toggle('card-view',compact);
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  const parseJsonl=text=>text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).flatMap(line=>{try{return[JSON.parse(line)]}catch{return[]}});
  const typeLabel=type=>({http:['↳','HTTP'],javascript:['⚡','JavaScript / navigation'],meta_refresh:['⏱','Meta refresh']}[type]||['↪',String(type||'Redirect').replaceAll('_',' ')]);
  const summary=document.getElementById('card-summary'),content=document.getElementById('content');
  const urlNode=(url,label,cls)=>{const node=el('div',null,'node '+(cls||''));node.append(el('span',label,'node-label'));if(url)node.append(safeLink(url,url));else node.append(el('span','Unknown URL','url muted'));return node};
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(text=>{
    const records=parseJsonl(text),initial=records.find(r=>r.type==='initial'),transitions=records.filter(r=>r.type!=='initial'&&r.to_url),start=initial?.to_url||transitions[0]?.from_url,final=transitions.at(-1)?.to_url||start;
    let finalHost='';try{finalHost=new URL(final).host}catch{}
    summary.append(el('span',start||'Redirect chain'),el('span',transitions.length+' redirect'+(transitions.length===1?'':'s'),'badge'));if(finalHost)summary.append(el('span','→ '+finalHost,'badge'));
    if(compact)return;
    const panel=el('section',null,'panel'),overview=el('div',null,'overview');overview.append(el('strong','🧭 Navigation path'),el('span',transitions.length+' hop'+(transitions.length===1?'':'s'),'badge'));if(transitions.some(r=>r.type==='http'))overview.append(el('span','HTTP','badge'));if(transitions.some(r=>r.type==='javascript'))overview.append(el('span','⚡ Script / navigation','badge'));if(transitions.some(r=>r.type==='meta_refresh'))overview.append(el('span','⏱ Meta','badge'));panel.append(overview);
    const chain=el('div',null,'chain');
    if(!transitions.length){chain.append(urlNode(start,'Captured URL','start'),el('div','No redirect transitions were recorded.','muted'));panel.append(chain);content.append(panel);return}
    transitions.forEach((record,index)=>{const block=el('div',null,'transition'),info=typeLabel(record.type),edge=el('div',null,'edge'),middle=el('div',null,'edge-info'),cause=el('span',info[0]+' '+info[1],'cause '+(record.type||''));if(record.status)cause.append(el('span',record.status,'badge'));middle.append(cause,el('div','↓','edge-arrow'));if(record.content)middle.append(el('span',record.content,'detail'));edge.append(middle);block.append(urlNode(record.from_url||((index===0)&&start),'From',index===0?'start':''),edge,urlNode(record.to_url,'To',index===transitions.length-1?'end':''));chain.append(block)});
    panel.append(chain);content.append(panel);
  }).catch(()=>content.append(el('div','Unable to read redirect data.','panel muted')));
})();
</script></body></html>
