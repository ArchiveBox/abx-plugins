<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saved files</title>
    <style>
      :root {
        color-scheme: light;
        --line: #dfe4eb;
        --muted: #667085;
        --blue: #245dc1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        color: #253247;
        background: white;
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      button,
      input {
        font: inherit;
      }
      button,
      a.action {
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: white;
        padding: 5px 10px;
        color: #344054;
      }
      button:hover,
      a.action:hover {
        background: #f0f5ff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      nav {
        display: flex;
        gap: 6px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        background: #f8fafc;
        border-bottom: 1px solid var(--line);
      }
      #breadcrumbs {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        min-width: 0;
      }
      #breadcrumbs button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--blue);
      }
      #count {
        color: var(--muted);
        white-space: nowrap;
        margin-left: auto;
      }
      #search {
        width: 160px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 8px;
      }
      main {
        display: flex;
        min-height: 0;
        flex: 1;
      }
      .listing {
        overflow: auto;
        flex: 1;
        min-width: 260px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        position: sticky;
        top: 0;
        background: #fff;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 1px solid var(--line);
        padding: 8px 16px;
      }
      td {
        border-bottom: 1px solid #eef1f5;
        padding: 8px 16px;
      }
      td.name {
        width: 100%;
      }
      .entry {
        border: 0;
        background: none;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #253247;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .entry:hover {
        background: none;
        color: var(--blue);
      }
      .size,
      .date {
        color: var(--muted);
        white-space: nowrap;
        font-size: 12px;
      }
      tr.selected {
        background: #eaf2ff;
      }
      tr:hover {
        background: #f6f9fc;
      }
      #preview {
        width: 55%;
        min-width: 280px;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #preview[hidden] {
        display: none;
      }
      .preview-head {
        padding: 9px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
      }
      #filename {
        overflow-wrap: anywhere;
        font-weight: 600;
        margin-right: auto;
      }
      #content {
        overflow: auto;
        padding: 16px;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      #content img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #content pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        align-self: stretch;
        margin: 0;
        width: 100%;
        font: 12px/1.6 ui-monospace, monospace;
      }
      #content iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #content audio,
      #content video {
        max-width: 100%;
      }
      .empty {
        padding: 22px;
        color: var(--muted);
      }
      #error {
        color: #b42318;
        padding: 8px 16px;
        margin: 0;
      }
      #error:empty {
        display: none;
      }
      @media (max-width: 640px) {
        header {
          flex-wrap: wrap;
          padding: 9px 12px;
        }
        nav {
          margin-left: 0;
        }
        .toolbar {
          padding: 8px 12px;
        }
        #search {
          width: 100px;
        }
        .date {
          display: none;
        }
        main {
          flex-direction: column;
        }
        .listing {
          min-height: 140px;
        }
        #preview {
          width: 100%;
          border-left: 0;
          border-top: 1px solid var(--line);
          min-height: 300px;
          flex: 1;
        }
        td,
        th {
          padding: 8px 12px;
        }
      }
    </style>
  </head>
  <body data-output="{{ output_path }}">
    <header>
      <h1 id="title">{{ plugin_icon }} Saved files</h1>
      <nav id="actions" aria-label="Output actions">
        <a class="action" id="files">View all files</a>
      </nav>
    </header>
    <div class="toolbar">
      <div id="breadcrumbs"></div>
      <span id="count"></span
      ><input
        id="search"
        aria-label="Filter files"
        placeholder="Filter files"
      />
    </div>
    <p id="error" role="alert"></p>
    <main>
      <section class="listing" aria-label="Files">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Size</th>
            </tr>
          </thead>
          <tbody id="entries"></tbody>
        </table>
      </section>
      <section id="preview" aria-label="File preview" hidden>
        <div class="preview-head">
          <span id="filename"></span><button id="download">Download</button
          ><button id="close" aria-label="Close preview">×</button>
        </div>
        <div id="content"></div>
      </section>
    </main>
    <script>
      (() => {
        const byId = (id) => document.getElementById(id),
          el = (tag, text, cls) => {
            const n = document.createElement(tag);
            if (text != null) n.textContent = text;
            if (cls) n.className = cls;
            return n;
          };
        const output = new URL(document.body.dataset.output, document.baseURI);
        output.search = "";
        output.hash = "";
        const folder = new URL("./", output),
          raw = new URL(output);
        raw.searchParams.set("raw", "1");
        byId("files").href = new URL("files/", folder).href + "?files=1";
        const bytes = (n) =>
          n < 1024
            ? n + " B"
            : n < 1048576
            ? (n / 1024).toFixed(1) + " KB"
            : n < 1073741824
            ? (n / 1048576).toFixed(1) + " MB"
            : (n / 1073741824).toFixed(2) + " GB";
        const valid = (path) =>
          typeof path === "string" &&
          path.startsWith("files/") &&
          !path.split("/").some((p) => !p || p === "." || p === "..") &&
          !path.includes("\\");
        const fileURL = (file) => {
          const url = new URL(
            file.path.split("/").map(encodeURIComponent).join("/"),
            folder
          );
          url.searchParams.set("raw", "1");
          return url.href;
        };
        let files = [],
          prefix = "",
          selected = null,
          controller = null;
        const clearPreview = () => {
          controller?.abort();
          byId("content").replaceChildren();
        };
        const report = (error) => {
          if (error.name !== "AbortError")
            byId("error").textContent = error.message;
        };
        function browse(next) {
          prefix = next;
          const filter = byId("search").value.toLowerCase(),
            crumbs = byId("breadcrumbs");
          crumbs.replaceChildren();
          const crumb = (label, path) => {
            const b = el("button", label);
            b.onclick = () => {
              byId("search").value = "";
              browse(path);
            };
            crumbs.append(b);
          };
          crumb("Files", "");
          let part = "";
          for (const segment of prefix.split("/").filter(Boolean)) {
            part += segment + "/";
            crumbs.append(el("span", "/"));
            crumb(segment, part);
          }
          const items = new Map();
          for (const f of files) {
            if (!f.filename.startsWith(prefix)) continue;
            const tail = f.filename.slice(prefix.length),
              name = tail.split("/")[0];
            if (!name || !name.toLowerCase().includes(filter)) continue;
            const directory = tail.includes("/");
            if (!items.has(name) || directory)
              items.set(
                name,
                directory ? { filename: prefix + name, directory: true } : f
              );
          }
          const table = byId("entries");
          table.replaceChildren();
          for (const file of [...items.values()].sort(
            (a, b) =>
              Number(b.directory) - Number(a.directory) ||
              a.filename.localeCompare(b.filename)
          )) {
            const row = el("tr");
            if (file === selected) row.className = "selected";
            const name = el("td", null, "name"),
              button = el("button", null, "entry");
            button.append(
              el("span", file.directory ? "📁" : "📄"),
              el("span", file.filename.slice(prefix.length))
            );
            button.onclick = () =>
              file.directory ? browse(file.filename + "/") : openFile(file);
            name.append(button);
            row.append(
              name,
              el("td", file.directory ? "—" : bytes(file.size), "size")
            );
            table.append(row);
          }
          byId("count").textContent = items.size + " items";
          if (!items.size) {
            const row = el("tr"),
              cell = el("td", "No files", "empty");
            cell.colSpan = 2;
            row.append(cell);
            table.append(row);
          }
        }
        async function openFile(file) {
          clearPreview();
          selected = file;
          controller = new AbortController();
          const signal = controller.signal;
          byId("error").textContent = "";
          byId("preview").hidden = false;
          byId("filename").textContent = file.filename.split("/").pop();
          const url = fileURL(file);
          byId("download").href = url;
          byId("download").download = file.filename.split("/").pop();
          browse(prefix);
          const content = byId("content"),
            ext = file.filename.split(".").pop().toLowerCase();
          if (ext === "zip") {
            const preview = new URL(url);
            preview.searchParams.delete("raw");
            preview.searchParams.set("preview", "1");
            const link = el("a", "Browse archive");
            link.href = preview.href;
            content.append(link);
            return;
          }
          if (file.size > 16 * 1024 * 1024) {
            content.append(
              el("span", "File is too large to preview. Use Download.", "empty")
            );
            return;
          }
          if (
            ["png", "jpg", "jpeg", "gif", "webp", "avif", "bmp"].includes(ext)
          ) {
            const img = el("img");
            img.alt = file.filename;
            img.src = url;
            content.append(img);
          } else if (ext === "pdf") {
            const frame = el("iframe");
            frame.title = file.filename;
            frame.setAttribute("sandbox", "");
            frame.src = url;
            content.append(frame);
          } else if (["mp3", "ogg", "wav", "mp4", "webm"].includes(ext)) {
            const media = el(["mp4", "webm"].includes(ext) ? "video" : "audio");
            media.controls = true;
            media.src = url;
            content.append(media);
          } else if (
            /^(txt|md|csv|tsv|json|xml|html?|css|js|py|log|ya?ml|svg|rtf)$/.test(
              ext
            )
          ) {
            content.append(el("span", "Loading…", "empty"));
            try {
              const response = await fetch(url, { signal });
              if (!response.ok) throw Error("File unavailable");
              const text = await response.text();
              if (!signal.aborted) content.replaceChildren(el("pre", text));
            } catch (error) {
              report(error);
            }
          } else
            content.append(
              el(
                "span",
                "Preview unavailable for this file type. Use Download.",
                "empty"
              )
            );
        }
        byId("search").oninput = () => browse(prefix);
        byId("close").onclick = () => {
          clearPreview();
          selected = null;
          byId("preview").hidden = true;
          browse(prefix);
        };
        fetch(raw, { cache: "no-store" })
          .then((r) => {
            if (!r.ok) throw Error("File details unavailable");
            return r.json();
          })
          .then((manifest) => {
            byId("title").textContent = manifest.title || "Saved files";
            document.title = byId("title").textContent;
            files = (manifest.files || [])
              .filter((f) => valid(f.path))
              .map((f) => ({ ...f, filename: f.path.slice(6) }));
            browse("");
          })
          .catch(report);
      })();
    </script>
  </body>
</html>
