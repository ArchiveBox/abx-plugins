limit_conn_zone $binary_remote_addr zone=per_ip:1m;
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    # Public admission remains closed: see tests/RESULTS.md for live concurrency failures.
    # The notary is available only on the operator's loopback port for investigation.
    location = /notarize {
        default_type text/plain;
        return 503 "Public notarization is not enabled: upstream concurrency validation is incomplete. See the TLSNotary plugin's tests/RESULTS.md.\n";
    }
    location / { try_files $uri $uri/ =404; }
}
