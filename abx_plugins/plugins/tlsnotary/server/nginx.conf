limit_conn_zone $binary_remote_addr zone=per_ip:1m;
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    location = /notarize {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 185s;
        proxy_send_timeout 185s;
        proxy_next_upstream off;
        proxy_pass http://notary:7048;
    }
    location / { try_files $uri $uri/ =404; }
}
