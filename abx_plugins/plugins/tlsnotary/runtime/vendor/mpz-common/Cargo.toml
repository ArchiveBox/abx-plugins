[package]
name = "mpz-common"
version = "0.1.0-alpha.6"
edition = "2024"

[features]
default = []
executor = []
sync = ["tokio/sync"]
future = []
test-utils = ["tokio/io-util", "tokio-util/compat"]
ideal = ["tokio/sync"]

[dependencies]
futures = { version = "0.3" }
async-trait = { version = "0.1" }
bytes = { version = "1" }
pin-project-lite = { version = "0.2" }
thiserror = { version = "1" }
serio = { version = "0.2" }
serde = { version = "1.0", features = ["derive"] }
pollster = { version = "0.3" }
cfg-if = { version = "1" }
tokio = { version = "1.23", default-features = false, optional = true }
tokio-util = { version = "0.7" }
crossbeam-channel = { version = "0.5" }
crossbeam-deque = { version = "0.8" }
crossbeam-utils = { version = "0.8" }
async-task = { version = "4" }
