[package]
name = "abx-tlsnotary"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "abx-tlsnotary"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:tlsn", "dep:tokio", "dep:tokio-util", "dep:async-tungstenite", "dep:ws_stream_tungstenite", "dep:clap", "dep:k256", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
web = ["dep:wasm-bindgen", "getrandom/wasm_js", "dep:getrandom02"]

[dependencies]
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["mozilla-certs"] }
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["mozilla-certs"], optional = true }
anyhow = "1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
httparse = "1"
flate2 = "1"
url = "2"
futures = "0.3"
getrandom = "0.3"
wasm-bindgen = { version = "=0.2.126", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"], optional = true }
ws_stream_tungstenite = { version = "0.15", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

# Upstream bounded stream admission fixes TooManyStreams under asymmetric load.
[patch."https://github.com/tlsnotary/tlsn-utils"]
tlsn-mux = { path = "vendor/tlsn-mux" }

[patch."https://github.com/privacy-ethereum/mpz"]
mpz-common = { path = "vendor/mpz-common" }
