<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive Import</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#1f2328;font:14px/1.5 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #d1d9e0;padding:16px 24px}header strong{font-size:17px}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:25px 0 10px}.meta{color:#59636e}.files{background:#fff;border:1px solid #d1d9e0;border-radius:6px}.file{display:flex;gap:12px;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee;overflow-wrap:anywhere}.file:last-child{border:0}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}@media(max-width:600px){main{padding:16px}header{padding:12px 16px}}
</style></head><body><header><strong>Archive Import</strong></header><main id="content">Loading archive…</main><script>
(()=>{const output=new URL('{{ output_path|escapejs }}',location.href);output.pathname=output.pathname.replace(/[^/]+$/,'metadata.json');output.search='';output.hash='';const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};fetch(output).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{const main=document.getElementById('content'),capture=data.archiveimport||{},info=data.metadata||{};main.replaceChildren();main.append(el('h1',info.title||capture.source||'Archive'),el('p',capture.source||'', 'meta'));if(info.description)main.append(el('p',typeof info.description==='string'?info.description:info.description.join(' ')));main.append(el('h2','Downloaded files'));const files=el('div',null,'files');for(const file of capture.files||[]){const row=el('div',null,'file'),link=el('a',file.name);link.href=new URL(file.path.split('/').map(encodeURIComponent).join('/'),output).href;row.append(link,el('span',file.size==null?'':(file.size/1024).toFixed(1)+' KiB','meta'));files.append(row)}main.append(files)}).catch(()=>{document.getElementById('content').textContent='Unable to read archive metadata.'})})();
</script></body></html>
