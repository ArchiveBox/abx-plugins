services:
  verifier:
    # Upstream d44623434d04ad00d7b1f8da9712cbc10cd0e99c, matches tested extension.
    image: ghcr.io/tlsnotary/tlsn-extension/demo-verifier-server@sha256:1240f4d63f2f92026be89cf208b6761ba6873959bb8d14a3e3f2fc26baf8483c
    ports:
      - "127.0.0.1:7047:7047"
    volumes:
      - ./verifier-config.yaml:/app/config.yaml:ro
    environment:
      PORT: "7047"
      # This revision hardcodes INFO logging; RUST_LOG does not suppress transcripts.
      RUST_LOG: warn
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
